// 音樂淡入淡出（預設 2 秒）
const fadeTimers = new WeakMap();

function fadeAudio(audio, from, to, duration = 2000, onComplete = null) {
  if (!audio) return;

  // 取消同一首音樂正在進行的淡入淡出
  if (fadeTimers.has(audio)) {
    clearInterval(fadeTimers.get(audio));
  }

  const start = performance.now();
  audio.volume = from;

  const timer = setInterval(() => {
    const progress = Math.min(
      (performance.now() - start) / duration, 1
    );

    audio.volume = Math.max(
      0,
      Math.min(1, from + (to - from) * progress)
    );

    if (progress >= 1) {
      clearInterval(timer);
      fadeTimers.delete(audio);
      if (onComplete) onComplete();
    }
  }, 30);

  fadeTimers.set(audio, timer);
}

async function revealResultsEarly() {
  if (gameOver || !timerInterval) return;

  if (!firebaseAuth.currentUser ||
      firebaseAuth.currentUser.uid !== ADMIN_UID) {
    alert("只有主持人可以公布結果");
    return;
  }

  const confirmed = confirm(
    "確定要提前結束投票並公布結果嗎？\n此操作無法復原。"
  );

  if (!confirmed) return;

  const button = document.getElementById("revealResultsButton");
  button.disabled = true;
  button.textContent = "正在結束投票……";

  try {
    const sessionSnapshot = await get(
      ref(firebaseDB, "currentSession")
    );

    if (!sessionSnapshot.exists()) {
      throw new Error("找不到投票場次");
    }

    const sessionId = sessionSnapshot.val();

    await set(
      ref(firebaseDB, "sessions/" + sessionId + "/config/status"),
      "closed"
    );

    gameOver = true;
    gameStarted = false;
    stopTimer();

    rectangle(x, y + 35, 9, 23, "#4b536a");

    // 腳
    let legOffset = 0;

    if (player.state === "walking") {
      legOffset = Math.sin(animationTime * 0.2) * 5;
    }

    rectangle(
      x + 10,
      y + 57,
      10,
      15 + legOffset,
      "#273044"
    );

    rectangle(
      x + 27,
      y + 57,
      10,
      15 - legOffset,
      "#273044"
    );
  }

  // ====================================
  // 對話
  // ====================================

  function showDialogue(message) {
    dialogue.style.display = "block";
    dialogue.textContent = message;
  }

  function hideDialogue() {
    dialogue.style.display = "none";
  }

  // ====================================
  // 開始遊戲
  // ====================================

  function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(
      screen => screen.classList.remove("active")
    );
  }


let transitionStart = 0;
 function startGame() {
  hideAllScreens();

puzzleMusic.currentTime = 0;
puzzleMusic.play().catch(err => {
  console.log("解謎音樂播放失敗：", err);
});
    
  gameStarted = false;
  animationTime = 0;
  clueShown = false;

  player.x = 120;
  player.state = "idle";

  hideDialogue();

  const flash = document.getElementById("flash");

  // 白光閃過，逐漸露出宿舍
  flash.classList.remove("active");
    transitionStart = performance.now();
  void flash.offsetWidth;
  flash.classList.add("active");

  // 2 秒後主角漸漸出現
  canvas.style.opacity = "1";

  // 4 秒後才開始走路
  setTimeout(() => {
    player.state = "walking";
    gameStarted = true;
    showDialogue("主角：電腦好像被入侵了……");
  }, 4000);
}


  // ====================================
  // 主角自動走路與撿拾
  // ====================================

  let clueShown = false;

  function updatePlayer() {

    if (!gameStarted) return;

    animationTime++;

    if (player.state === "walking") {

      player.x += player.speed;

      if (player.x >= player.targetX) {
        player.x = player.targetX;
        player.state = "investigating";

        showDialogue(
          "主角：奇怪……地上怎麼有東西？"
        );
      }
    }

    if (player.state === "investigating") {

      if (animationTime > 260) {
        player.state = "picking";
        showDialogue("主角：這是什麼線索？");
      }
    }

    if (player.state === "picking") {

      if (animationTime > 340 && !clueShown) {
        clueShown = true;
        player.state = "finished";

        hideDialogue();

        setTimeout(showClues, 800);
      }
    }
  }

  // ====================================
  // 同時顯示兩個線索
  // ====================================


async function showClues() {
  if (gameOver) return;

  if (!firebaseAuth.currentUser ||
      firebaseAuth.currentUser.uid !== ADMIN_UID) {
    alert("請先登入主持人帳號");
    return;
  }

  gameStarted = false;

  const sessionId = "round_" + Date.now();
  const startedAt = Date.now();
  const endsAt = startedAt + 300000;
  votingEndsAt = endsAt;

  try {
    // 建立新的五分鐘投票場次
    await set(ref(firebaseDB, "sessions/" + sessionId + "/config"), {
      startedAt,
      endsAt,
      status: "open"
    });

    // 告訴所有觀眾目前是哪一場投票
    await set(ref(firebaseDB, "currentSession"), sessionId);

    // 投票建立成功後，才顯示線索與倒數
    hideAllScreens();

    document.getElementById("clueScreen")
      .classList.add("active");

    startTimer();

document.getElementById("revealResultsButton").style.display = "block";

  } catch (error) {
    console.error("建立投票場次失敗：", error);
    alert("無法開始投票，請檢查 Firebase 設定與網路連線");
  }
}

  // ====================================
  // 四位嫌疑人
  // ====================================

 function showSuspects() {
  hideAllScreens();

  document.getElementById("suspectScreen")
    .classList.add("active");

  const list = document.getElementById("suspectList");
  list.innerHTML = "";

  suspects.forEach((suspect, index) => {
    const card = document.createElement("div");
    card.className = "suspect";

    if (selectedSuspect === index) {
      card.classList.add("selected");
    }

    // 頭像
    const avatar = document.createElement("img");
    avatar.src = suspect.image;
    avatar.className = "suspect-avatar";
    avatar.alt = "嫌疑犯頭像";

    avatar.onclick = () => {
      selectedSuspect = index;
      showSuspects();
    };

    // 播放／暫停
    const playButton = document.createElement("button");
    playButton.className = "suspect-play-btn";
    playButton.dataset.index = index;

    playButton.textContent =
      currentAudio &&
      currentSuspectIndex === index &&
      !currentAudio.paused
        ? "⏸ 暫停"
        : "▶ 播放";

    playButton.onclick = () => playMusic(index);

    const selectText = document.createElement("p");
    selectText.textContent =
      selectedSuspect === index ? "✓ 已選擇" : "點擊頭像選擇";

    card.appendChild(avatar);
    card.appendChild(playButton);
    card.appendChild(selectText);

    list.appendChild(card);
  });
}

  // ====================================
  // 播放音樂
  // ====================================

function updatePlayButtons() {
  document.querySelectorAll(".suspect-play-btn").forEach(btn => {
    const i = Number(btn.dataset.index);

    btn.textContent =
      currentAudio &&
      currentSuspectIndex === i &&
      !currentAudio.paused
        ? "⏸ 暫停"
        : "▶ 播放";
  });
}

function playMusic(index) {

  // 同一位嫌疑犯：暫停或繼續
  if (currentAudio && currentSuspectIndex === index) {
    const audio = currentAudio;

    if (!audio.paused) {
      fadeAudio(audio, audio.volume, 0, 500, () => {
        audio.pause();
        updatePlayButtons();
      });
    } else {
      audio.play().then(() => {
        fadeAudio(audio, audio.volume, 1, 500);
        updatePlayButtons();
      }).catch(console.error);
    }
    return;
  }

  // 背景音樂淡出
  fadeAudio(puzzleMusic, puzzleMusic.volume, 0, 2000, () => {
    puzzleMusic.pause();
  });

  // 前一位嫌疑犯淡出
  if (currentAudio) {
    const oldAudio = currentAudio;
    oldAudio.onended = null;

    fadeAudio(oldAudio, oldAudio.volume, 0, 1000, () => {
      oldAudio.pause();
      oldAudio.currentTime = 0;
    });
  }

  // 新嫌疑犯音樂淡入
  const newAudio = new Audio(suspects[index].audio);

  currentAudio = newAudio;
  currentSuspectIndex = index;
  newAudio.volume = 0;

  newAudio.play().then(() => {
    fadeAudio(newAudio, 0, 1, 2000);
    updatePlayButtons();
  }).catch(console.error);

  // 播放結束後，恢復解謎音樂
  newAudio.onended = () => {
    if (currentAudio !== newAudio) return;

    currentAudio = null;
    currentSuspectIndex = -1;
    updatePlayButtons();

    puzzleMusic.volume = 0;
    puzzleMusic.play().then(() => {
      fadeAudio(puzzleMusic, 0, 0.3, 2000);
    }).catch(console.error);
  };

  updatePlayButtons();
}

  // ====================================
  // 確認駭客身分
  // ====================================

 
function confirmSuspect() {
  if (gameOver) return;

  // 沒有選擇嫌疑犯
  if (selectedSuspect === -1) {
    alert("請先選擇一位嫌疑人！");
    return;
  }

  // 選錯：提示玩家繼續調查
  if (selectedSuspect !== correctSuspect) {
    alert("指認錯誤！請再仔細聆聽音樂，繼續尋找真正的駭客！");
    selectedSuspect = -1;
    showSuspects();
    return;
  }

stopTimer();
document.getElementById("timer").style.display = "none";
  
 // 選對：立即停止嫌疑犯音樂
if (currentAudio) {
  currentAudio.pause();
  currentAudio.currentTime = 0;
  currentAudio = null;
  currentSuspectIndex = -1;
}

  // 停止解謎背景音樂
  puzzleMusic.pause();
  puzzleMusic.currentTime = 0;

  // 播放成功影片
  playStoryVideo("videos/success.mp4", () => {
    hideAllScreens();

    document.getElementById("resultScreen")
      .classList.add("active");

    document.getElementById("resultText").textContent =
      "成功找出真正的駭客！";
  });
}

  // ====================================
  // 遊戲主迴圈
  // ====================================

  function gameLoop() {

    ctx.clearRect(0, 0, 960, 540);

    drawRoom();
    updatePlayer();
   
if (!gameStarted && player.state === "idle") {
  const flash = document.getElementById("flash");

  if (flash.classList.contains("active")) {
    const elapsed = performance.now() - transitionStart;
    ctx.globalAlpha = Math.min(1, Math.max(0, (elapsed - 1500) / 1500));
  }
}

drawPlayer();
ctx.globalAlpha = 1;


    requestAnimationFrame(gameLoop);
  }

  // 初始化
  gameLoop();

  window.startOpening = startOpening;
window.skipCurrentVideo = skipCurrentVideo;
window.showSuspects = showSuspects;
window.confirmSuspect = confirmSuspect;

</script>
