
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錄音期中：駭客在哪裡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c18;
      color: white;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #game {
      position: relative;
      width: min(100vw, 177.78vh);
      aspect-ratio: 16 / 9;
      background: #151d32;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 25, 0.94);
      padding: 30px;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: clamp(24px, 4vw, 48px);
      color: #92d8ff;
    }

    h2 {
      color: #e9d6a7;
    }

    button {
      padding: 12px 22px;
      margin: 8px;
      border: 2px solid #91c8ee;
      background: #263954;
      color: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #426b91;
    }

    #dialogue {
      position: absolute;
      bottom: 4%;
      left: 8%;
      width: 84%;
      padding: 18px;
      background: rgba(9, 15, 30, 0.95);
      border: 3px solid #9abbd1;
      font-size: clamp(12px, 2vw, 20px);
      display: none;
    }

    .clues {
      display: flex;
      gap: 20px;
      width: 90%;
      justify-content: center;
    }

    .clue {
      width: 45%;
      min-height: 180px;
      padding: 20px;
      background: #e6ddc7;
      color: #252332;
      border: 5px solid #9e8a6d;
    }

    .suspects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 85%;
    }

    .suspect {
      padding: 10px;
      background: #202c43;
      border: 2px solid #647b9c;
    }

    .suspect.selected {
      border-color: #ffe18c;
      background: #3b4963;
    }

    .suspect button {
      font-size: 13px;
      padding: 8px;
    }

    #resultText {
      font-size: 22px;
      margin: 20px;
    }

  
#flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}

#flash.active {
  animation: whiteFlash 3s ease-out forwards;
}

@keyframes whiteFlash {
  0%   { opacity: 1; }
  15%  { opacity: 1; }
  100% { opacity: 0; }
}

  
  </style>
</head>

<body>

<div id="game">

<div id="videoScreen" class="screen">
  <video
    id="storyVideo"
    playsinline
    style="width:100%;height:100%;object-fit:contain;"
  ></video>

  <button
    onclick="skipCurrentVideo()"
    style="position:absolute;right:20px;bottom:20px;"
  >
    跳過影片
  </button>
</div>
  
  <canvas id="canvas" width="960" height="540"></canvas>

  <div id="dialogue"></div>
<div id="flash"></div>
  
  <!-- 開始畫面 -->
  <div id="start" class="screen active">
    <h1>錄音期中</h1>
    <h2>駭客在哪裡</h2>
    <p>去調查啦幹</p>
    <button onclick="startOpening()">開始遊戲</button>
  </div>

  <!-- 兩個線索同時顯示 -->
  <div id="clueScreen" class="screen">
    <h2>發現神祕線索</h2>

    <div class="clues">

      <div class="clue">
        <h2>✉ 信封</h2>
        <p>線索一</p>
        <p>調性：E 小調</p>
        <p>這裡可以放你們真正的謎題</p>
      </div>

      <div class="clue">
        <h2>⚿ 鑰匙與便條紙</h2>
        <p>線索二</p>
        <p>這裡可以放節奏或旋律提示</p>
        <p>讓觀眾還原駭客的樂譜</p>
      </div>

    </div>

    <button onclick="showSuspects()">
      繼續調查
    </button>
  </div>

  <!-- 嫌疑人選擇 -->
  <div id="suspectScreen" class="screen">
    <h2>找出真正的駭客</h2>
    <p>請聆聽四位嫌疑人的專屬音樂</p>

    <div class="suspects" id="suspectList"></div>

    <button onclick="confirmSuspect()">
      確認指認
    </button>
  </div>

  <!-- 結局 -->
  <div id="resultScreen" class="screen">
    <h1>調查結果</h1>
    <div id="resultText"></div>
    <button onclick="showSuspects()">重新選擇</button>
    <button onclick="location.reload()">重新開始</button>
  </div>

</div>

<script>
  // ====================================
  // 基本設定
  // ====================================

 const storyVideo = document.getElementById("storyVideo");

let videoNextAction = null;

function playStoryVideo(filename, nextAction) {
  hideAllScreens();

  document.getElementById("videoScreen")
    .classList.add("active");

  videoNextAction = nextAction;

  storyVideo.src = filename;
  storyVideo.currentTime = 0;
  storyVideo.play();
}

function finishCurrentVideo() {
  storyVideo.pause();
  storyVideo.removeAttribute("src");
  storyVideo.load();

  const next = videoNextAction;
  videoNextAction = null;

  if (next) next();
}

function skipCurrentVideo() {
  finishCurrentVideo();
}

storyVideo.addEventListener("ended", finishCurrentVideo);


function startOpening() {
  playStoryVideo(
    "videos/redpandacompress_IMG_2480 - Compressed with FlexClip.mp4",
    () => {
      startGame();
    }
  );
}
  
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;

  const dialogue = document.getElementById("dialogue");

  let gameStarted = false;
  let animationTime = 0;
  let selectedSuspect = -1;
  let currentAudio = null;

  // 真正的駭客是羅思穎，編號 0
  const correctSuspect = 0;

  const suspects = [
    {
      name: "羅思穎",
      instrument: "電子音樂",
      audio: "music/hacker.mp3"
    },
    {
      name: "許宸瑋",
      instrument: "中提琴",
      audio: "music/viola.mp3"
    },
    {
      name: "周裕軒",
      instrument: "人聲",
      audio: "music/vocal.mp3"
    },
    {
      name: "洪昕妤",
      instrument: "木吉他",
      audio: "music/guitar.mp3"
    }
  ];

  // ====================================
  // 畫圖工具
  // ====================================

  function rectangle(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(
      Math.round(x),
      Math.round(y),
      w,
      h
    );
  }

  function text(str, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = size + "px monospace";
    ctx.fillText(str, x, y);
  }

  // ====================================
  // 繪製 2D 宿舍
  // ====================================

 


function drawRoom() {
  const r = (x,y,w,h,c) => rectangle(x,y,w,h,c);

  // ===== 背景 =====
  r(0,0,960,540,"#111827");

  // 牆壁
  r(0,0,960,115,"#111b2b");
  r(0,110,960,8,"#344458");
  r(0,30,960,2,"#1c2b3d");
  r(0,75,960,2,"#1c2b3d");

  // 地板：深色木板
  r(0,118,960,422,"#1b2839");

  for(let y=118;y<540;y+=38){
    r(0,y,960,2,"#101a29");

    for(let x=0;x<960;x+=125){
      const offset = Math.floor(y/38)%2*62;
      r(x+offset,y+2,2,35,"#142132");
      r(x+offset+8,y+8,72,1,"#26364a");
      r(x+offset+25,y+25,55,1,"#202f42");
    }
  }

  // ===== 繪圖工具 =====
  function line(x1,y1,x2,y2,color,width=2){
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  function wood(x,y,w,h){
    r(x,y,w,h,"#997653");
    r(x,y,w,4,"#d4b185");
    r(x,y+h-5,w,5,"#62472f");

    for(let i=0;i<3;i++){
      const yy=y+10+i*9;
      if(yy<y+h-6){
        r(x+12,yy,w-24,1,"#b58d62");
      }
    }
  }

  function metal(x,y,w,h){
    r(x,y,w,h,"#66727b");
    r(x+2,y,3,h,"#b0bac0");
    r(x+w-3,y,3,h,"#394751");
  }

  // ===== 上舖 =====
  function bunk(x,mirror=false){

    // 床下陰影
    r(x+14,224,256,172,"#111b29");

    // 金屬立柱
    metal(x,115,13,294);
    metal(x+267,115,13,294);

    // 床板底部
    r(x+12,218,255,18,"#514234");
    r(x+12,218,255,5,"#b38d61");

    // 床墊
    r(x+18,166,244,49,"#8595a7");
    r(x+18,204,244,10,"#56697c");

    // 枕頭
    const pillowX=mirror?x+192:x+27;
    r(pillowX,172,49,29,"#d6d8d3");
    r(pillowX+4,176,41,21,"#f0e9da");
    r(pillowX+8,180,32,2,"#ffffff");

    // 棉被
    const blanketX=mirror?x+25:x+85;
    r(blanketX,171,154,33,"#506e91");
    r(blanketX,171,154,5,"#8099b7");
    r(blanketX+9,188,130,2,"#6882a3");
    r(blanketX+17,197,110,2,"#405c7c");

    // 木製床欄
    wood(x+12,126,255,10);
    wood(x+12,205,255,13);

    for(let i=0;i<6;i++){
      const px=x+24+i*43;
      wood(px,136,8,69);
      r(px+2,139,2,62,"#e0bc8b");
    }

    // 床欄端柱
    wood(x+12,120,12,98);
    wood(x+255,120,12,98);

    // 床底橫樑
    wood(x+14,230,251,10);
  }

  bunk(45,false);
  bunk(635,true);

  // ===== 書桌 =====
  function desk(x){

    // 桌面陰影
    r(x+3,321,224,13,"#3c302c");

    // 桌面
    wood(x,310,230,17);

    // 桌腳
    wood(x+12,327,13,88);
    wood(x+205,327,13,88);

    // 抽屜櫃
    r(x+30,333,73,66,"#68524d");
    r(x+34,337,65,27,"#836963");
    r(x+34,368,65,27,"#836963");

    r(x+58,349,18,3,"#d0ae83");
    r(x+58,380,18,3,"#d0ae83");

    // 木紋
    r(x+41,342,48,1,"#9b7c6b");
    r(x+41,373,48,1,"#9b7c6b");

    // 椅子
    r(x+135,365,55,10,"#5c6570");
    r(x+140,375,7,52,"#3c4654");
    r(x+181,375,7,52,"#3c4654");

    r(x+140,332,48,34,"#6d7885");
    r(x+145,337,38,24,"#3f5368");
    r(x+151,342,26,2,"#8a9aaa");
  }

  desk(70);
  desk(660);

  // ===== 左側電腦 =====
  r(144,251,103,64,"#080f19");
  r(150,257,91,52,"#2b5265");
  r(155,262,81,42,"#17495b");

  r(163,271,43,3,"#69c7d1");
  r(163,279,58,2,"#39899b");
  r(163,286,34,2,"#39899b");

  r(189,315,11,10,"#59636e");
  r(174,324,41,4,"#434b57");

  // ===== 右側駭客電腦光暈 =====
  const pulse=0.8+Math.sin(Date.now()/420)*0.2;

  ctx.save();

  const glow=ctx.createRadialGradient(
    774,275,8,
    774,275,175
  );

  glow.addColorStop(
    0,
    `rgba(0,220,190,${0.23*pulse})`
  );

  glow.addColorStop(
    1,
    "rgba(0,220,190,0)"
  );

  ctx.fillStyle=glow;
  ctx.fillRect(600,110,350,350);
  ctx.restore();

  // 電腦外框
  r(720,247,112,69,"#07101b");
  r(726,253,100,57,"#31505a");
  r(731,258,90,47,"#073b3c");

  // 程式碼
  r(739,265,42,2,"#49d9bb");
  r(739,271,64,2,"#248e80");
  r(739,297,50,2,"#49d9bb");

  if(Math.sin(Date.now()/220)>-0.5){
    text("HACKED",742,290,14,"#a0ffe4");
  }

  r(769,316,13,10,"#4c5a61");
  r(753,326,45,4,"#3c4853");

  // ===== 桌燈 =====
  r(689,272,8,39,"#8b8d89");
  r(673,257,39,17,"#c4a36b");
  r(678,273,29,4,"#f2cf91");

 

  // ===== 中央木製樓梯 V3：上窄下寬 =====

  const stairCenter = 470;
  const stairTop = 174;
  const stepH = 46;

  // 後方陰影
  r(376, 176, 188, 237, "#17202b");

  // 五階樓梯：由上往下逐漸變寬
  for (let i = 0; i < 5; i++) {
    const w = 100 + i * 20;
    const x = stairCenter - w / 2;
    const y = stairTop + i * stepH;

    // 階梯側邊深色結構
    r(x - 6, y + 5, w + 12, stepH, "#604630");

    // 階梯正面
    r(x, y + 9, w, stepH - 9,
      i % 2 === 0 ? "#a58059" : "#96714d");

    // 踏板頂部
    r(x - 4, y, w + 8, 12, "#d2aa79");

    // 踏板高光
    r(x - 2, y + 2, w + 4, 3, "#f0c995");

    // 踏板厚度
    r(x - 4, y + 10, w + 8, 6, "#79583e");

    // 木紋
    r(x + 15, y + 23, w * 0.35, 2, "#c49a6d");
    r(x + w * 0.55, y + 32, w * 0.23, 2, "#79593f");

    // 階梯底部陰影
    r(x, y + stepH - 5, w, 5, "#523b2b");
  }

  // 左右側板：跟著樓梯逐漸向外展開
  for (let i = 0; i < 5; i++) {
    const w = 100 + i * 20;
    const x = stairCenter - w / 2;
    const y = stairTop + i * stepH;

    r(x - 9, y + 3, 9, stepH, "#765539");
    r(x + w, y + 3, 9, stepH, "#765539");

    // 側板木頭高光
    r(x - 7, y + 4, 2, stepH - 4, "#bd9263");
    r(x + w + 2, y + 4, 2, stepH - 4, "#bd9263");
  }

  // 樓梯底部收邊
  r(370, 404, 200, 10, "#523b2c");
  r(376, 404, 188, 3, "#b68c61");

  // ===== 地毯 =====
  r(332,417,295,91,"#263348");
  r(340,425,279,75,"#506078");
  r(348,433,263,59,"#394b64");

  // 地毯邊線
  r(340,425,279,3,"#8390a1");
  r(340,497,279,3,"#263348");

  // ===== 信封 =====
  r(591,437,42,27,"#c4b293");
  r(594,440,36,21,"#eee1c3");
  line(594,440,612,452,"#bba789",2);
  line(630,440,612,452,"#bba789",2);

  // ===== 鑰匙 =====
  r(646,452,28,5,"#e2c26e");
  r(642,446,14,14,"#e2c26e");
  r(646,450,6,6,"#3b4b61");
  r(666,456,5,8,"#e2c26e");

  // ===== 線索提示 =====
  if(Math.floor(Date.now()/400)%2===0){
    text("!",604,426,24,"#ffe08a");
  }
}



  // ====================================
  // 主角
  // ====================================

  const player = {
    x: 120,
    y: 400,
    targetX: 575,
    speed: 2.2,
    state: "walking"
  };

  function drawPlayer() {

    const x = player.x;
    const y = player.y;

    // 影子
    rectangle(x + 3, y + 58, 38, 8, "#17202e");

    // 頭髮
    rectangle(x + 8, y, 27, 17, "#25202d");

    // 臉
    rectangle(x + 11, y + 12, 23, 20, "#e1b18e");

    // 眼睛
    rectangle(x + 27, y + 19, 4, 4, "#222331");

    // 衣服
    rectangle(x + 5, y + 32, 36, 25, "#718eb3");

    // 背包
    rectangle(x, y + 35, 9, 23, "#4b536a");

    // 腳
    let legOffset = 0;

    if (player.state === "walking") {
      legOffset = Math.sin(animationTime * 0.2) * 5;
    }

    rectangle(
      x + 10,
      y + 57,
      10,
      15 + legOffset,
      "#273044"
    );

    rectangle(
      x + 27,
      y + 57,
      10,
      15 - legOffset,
      "#273044"
    );
  }

  // ====================================
  // 對話
  // ====================================

  function showDialogue(message) {
    dialogue.style.display = "block";
    dialogue.textContent = message;
  }

  function hideDialogue() {
    dialogue.style.display = "none";
  }

  // ====================================
  // 開始遊戲
  // ====================================

  function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(
      screen => screen.classList.remove("active")
    );
  }


let transitionStart = 0;
  function startGame() {
  hideAllScreens();

  gameStarted = false;
  animationTime = 0;
  clueShown = false;

  player.x = 120;
  player.state = "idle";

  hideDialogue();

  const flash = document.getElementById("flash");

  // 白光閃過，逐漸露出宿舍
  flash.classList.remove("active");
    transitionStart = performance.now();
  void flash.offsetWidth;
  flash.classList.add("active");

  // 2 秒後主角漸漸出現
  canvas.style.opacity = "1";

  // 4 秒後才開始走路
  setTimeout(() => {
    player.state = "walking";
    gameStarted = true;
    showDialogue("主角：電腦好像被入侵了……");
  }, 4000);
}


  // ====================================
  // 主角自動走路與撿拾
  // ====================================

  let clueShown = false;

  function updatePlayer() {

    if (!gameStarted) return;

    animationTime++;

    if (player.state === "walking") {

      player.x += player.speed;

      if (player.x >= player.targetX) {
        player.x = player.targetX;
        player.state = "investigating";

        showDialogue(
          "主角：奇怪……地上怎麼有東西？"
        );
      }
    }

    if (player.state === "investigating") {

      if (animationTime > 260) {
        player.state = "picking";
        showDialogue("主角：這是什麼線索？");
      }
    }

    if (player.state === "picking") {

      if (animationTime > 340 && !clueShown) {
        clueShown = true;
        player.state = "finished";

        hideDialogue();

        setTimeout(showClues, 800);
      }
    }
  }

  // ====================================
  // 同時顯示兩個線索
  // ====================================

  function showClues() {
    gameStarted = false;
    hideAllScreens();

    document
      .getElementById("clueScreen")
      .classList.add("active");
  }

  // ====================================
  // 四位嫌疑人
  // ====================================

  function showSuspects() {

    hideAllScreens();

    document
      .getElementById("suspectScreen")
      .classList.add("active");

    const list = document.getElementById("suspectList");

    list.innerHTML = "";

    suspects.forEach((suspect, index) => {

      const card = document.createElement("div");

      card.className = "suspect";

      if (selectedSuspect === index) {
        card.classList.add("selected");
      }

      const title = document.createElement("h3");
      title.textContent = suspect.name;

      const instrument = document.createElement("p");
      instrument.textContent = suspect.instrument;

      const playButton = document.createElement("button");
      playButton.textContent = "▶ 試聽音樂";
      playButton.onclick = () => playMusic(index);

      const selectButton = document.createElement("button");
      selectButton.textContent =
        selectedSuspect === index ? "✓ 已選擇" : "指認此人";

      selectButton.onclick = () => {
        selectedSuspect = index;
        showSuspects();
      };

      card.appendChild(title);
      card.appendChild(instrument);
      card.appendChild(playButton);
      card.appendChild(selectButton);

      list.appendChild(card);
    });
  }

  // ====================================
  // 播放音樂
  // ====================================

  function playMusic(index) {

    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    currentAudio = new Audio(suspects[index].audio);

    currentAudio.play().catch(() => {
      alert(
        "尚未找到音樂檔案，請先加入：" +
        suspects[index].audio
      );
    });
  }

  // ====================================
  // 確認駭客身分
  // ====================================

 
function confirmSuspect() {
  if (selectedSuspect === -1) {
    alert("請先選擇一位嫌疑人！");
    return;
  }

  if (currentAudio) {
    currentAudio.pause();
  }

  const isCorrect = selectedSuspect === correctSuspect;

 const endingVideo = isCorrect
  ? "videos/success.mp4"
  : "videos/failure.mp4";

  playStoryVideo(endingVideo, () => {
    hideAllScreens();

    document.getElementById("resultScreen")
      .classList.add("active");

    document.getElementById("resultText").textContent =
      isCorrect
        ? "成功找出真正的駭客！"
        : "指認錯誤，駭客仍然逍遙法外……";
  });
}


  // ====================================

  function gameLoop() {

    ctx.clearRect(0, 0, 960, 540);

    drawRoom();
    updatePlayer();
   
if (!gameStarted && player.state === "idle") {
  const flash = document.getElementById("flash");

  if (flash.classList.contains("active")) {
    const elapsed = performance.now() - transitionStart;
    ctx.globalAlpha = Math.min(1, Math.max(0, (elapsed - 1500) / 1500));
  }
}

drawPlayer();
ctx.globalAlpha = 1;


    requestAnimationFrame(gameLoop);
  }

  gameLoop();
