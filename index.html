.sheet-music {

  /* 不規則破損邊緣 */

    0% 4%,
    4% 2%,
    8% 4%,
    15% 0%,
    25% 3%,
    38% 1%,

    62% 0%,
    75% 3%,

<script>
  // ====================================
  // 基本設定
  // ====================================

 const storyVideo = document.getElementById("storyVideo");

let videoNextAction = null;

function playStoryVideo(filename, nextAction) {
  hideAllScreens();

  document.getElementById("videoScreen")
    .classList.add("active");

  videoNextAction = nextAction;

  storyVideo.src = filename;
  storyVideo.currentTime = 0;
  storyVideo.play();
}

function finishCurrentVideo() {
  storyVideo.pause();
  storyVideo.removeAttribute("src");
  storyVideo.load();

  const next = videoNextAction;
  videoNextAction = null;

  if (next) next();
}

function skipCurrentVideo() {
  finishCurrentVideo();
}

storyVideo.addEventListener("ended", finishCurrentVideo);


function startOpening() {
  playStoryVideo(
    "videos/redpandacompress_IMG_2480 - Compressed with FlexClip.mp4",
    () => {
      startGame();
    }
  );
}
  
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;

  const dialogue = document.getElementById("dialogue");

  let gameStarted = false;
  let animationTime = 0;
  let selectedSuspect = -1;
  let currentAudio = null;
let currentSuspectIndex = -1;
  
// 音樂淡入淡出（預設 2 秒）
const fadeTimers = new WeakMap();

function fadeAudio(audio, from, to, duration = 2000, onComplete = null) {
  if (!audio) return;

  // 取消同一首音樂正在進行的淡入淡出
  if (fadeTimers.has(audio)) {
    clearInterval(fadeTimers.get(audio));
  }

  const start = performance.now();
  audio.volume = from;

  const timer = setInterval(() => {
    const progress = Math.min(
      (performance.now() - start) / duration, 1
    );

    audio.volume = Math.max(
      0,
      Math.min(1, from + (to - from) * progress)
    );

    if (progress >= 1) {
      clearInterval(timer);
      fadeTimers.delete(audio);
      if (onComplete) onComplete();
    }
  }, 30);

  fadeTimers.set(audio, timer);
}
  
const puzzleMusic = new Audio("music/puzzle.mp3");
puzzleMusic.loop = true;
puzzleMusic.volume = 0.3;
  
  // 真正的駭客是羅思穎，編號 0
  const correctSuspect = 0;

 const suspects = [

  // ====================================

  function rectangle(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(
      Math.round(x),
      Math.round(y),
      w,
      h
    );
  }

  function text(str, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = size + "px monospace";
    ctx.fillText(str, x, y);
  }

  // ====================================
  // 繪製 2D 宿舍
  // ====================================

 


function drawRoom() {
  const r = (x,y,w,h,c) => rectangle(x,y,w,h,c);

  // ===== 背景 =====
  r(0,0,960,540,"#111827");

  // 牆壁
  r(0,0,960,115,"#111b2b");
  r(0,110,960,8,"#344458");
  r(0,30,960,2,"#1c2b3d");
  r(0,75,960,2,"#1c2b3d");

  // 地板：深色木板
  r(0,118,960,422,"#1b2839");

  for(let y=118;y<540;y+=38){
    r(0,y,960,2,"#101a29");

    for(let x=0;x<960;x+=125){
      const offset = Math.floor(y/38)%2*62;
      r(x+offset,y+2,2,35,"#142132");
      r(x+offset+8,y+8,72,1,"#26364a");
      r(x+offset+25,y+25,55,1,"#202f42");
    }
  }

  // ===== 繪圖工具 =====
  function line(x1,y1,x2,y2,color,width=2){
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  function wood(x,y,w,h){
    r(x,y,w,h,"#997653");
    r(x,y,w,4,"#d4b185");
    r(x,y+h-5,w,5,"#62472f");

    for(let i=0;i<3;i++){
      const yy=y+10+i*9;
      if(yy<y+h-6){
        r(x+12,yy,w-24,1,"#b58d62");
      }
    }
  }

  function metal(x,y,w,h){
    r(x,y,w,h,"#66727b");
    r(x+2,y,3,h,"#b0bac0");
    r(x+w-3,y,3,h,"#394751");
  }

  // ===== 上舖 =====
  function bunk(x,mirror=false){

    // 床下陰影
    r(x+14,224,256,172,"#111b29");

    // 金屬立柱
    metal(x,115,13,294);
    metal(x+267,115,13,294);

    // 床板底部
    r(x+12,218,255,18,"#514234");
    r(x+12,218,255,5,"#b38d61");

    // 床墊
    r(x+18,166,244,49,"#8595a7");
    r(x+18,204,244,10,"#56697c");

    // 枕頭
    const pillowX=mirror?x+192:x+27;
    r(pillowX,172,49,29,"#d6d8d3");
    r(pillowX+4,176,41,21,"#f0e9da");
    r(pillowX+8,180,32,2,"#ffffff");

    // 棉被
    const blanketX=mirror?x+25:x+85;
    r(blanketX,171,154,33,"#506e91");
    r(blanketX,171,154,5,"#8099b7");
    r(blanketX+9,188,130,2,"#6882a3");
    r(blanketX+17,197,110,2,"#405c7c");

    // 木製床欄
    wood(x+12,126,255,10);
    wood(x+12,205,255,13);

    for(let i=0;i<6;i++){
      const px=x+24+i*43;
      wood(px,136,8,69);
      r(px+2,139,2,62,"#e0bc8b");
    }

    // 床欄端柱
    wood(x+12,120,12,98);
    wood(x+255,120,12,98);

    // 床底橫樑
    wood(x+14,230,251,10);
  }

  bunk(90,false);
bunk(557,true);

  // ===== 書桌 =====
  function desk(x){

    // 桌面陰影
    r(x+3,321,224,13,"#3c302c");

    // 桌面
    wood(x,310,230,17);

    // 桌腳
    wood(x+12,327,13,88);
    wood(x+205,327,13,88);

    // 抽屜櫃
    r(x+30,333,73,66,"#68524d");
    r(x+34,337,65,27,"#836963");
    r(x+34,368,65,27,"#836963");

    r(x+58,349,18,3,"#d0ae83");
    r(x+58,380,18,3,"#d0ae83");

    // 木紋
    r(x+41,342,48,1,"#9b7c6b");
    r(x+41,373,48,1,"#9b7c6b");

    // 椅子
    r(x+135,365,55,10,"#5c6570");
    r(x+140,375,7,52,"#3c4654");
    r(x+181,375,7,52,"#3c4654");

    r(x+140,332,48,34,"#6d7885");
    r(x+145,337,38,24,"#3f5368");
    r(x+151,342,26,2,"#8a9aaa");
  }

  desk(70);
  desk(660);

  // ===== 左側電腦 =====
  r(144,251,103,64,"#080f19");
  r(150,257,91,52,"#2b5265");
  r(155,262,81,42,"#17495b");

  r(163,271,43,3,"#69c7d1");
  r(163,279,58,2,"#39899b");
  r(163,286,34,2,"#39899b");

  r(189,315,11,10,"#59636e");
  r(174,324,41,4,"#434b57");

  // ===== 右側駭客電腦光暈 =====
  const pulse=0.8+Math.sin(Date.now()/420)*0.2;

  ctx.save();

  const glow=ctx.createRadialGradient(
    774,275,8,
    774,275,175
  );

  glow.addColorStop(
    0,
    `rgba(0,220,190,${0.23*pulse})`
  );

  glow.addColorStop(
    1,
    "rgba(0,220,190,0)"
  );

  ctx.fillStyle=glow;
  ctx.fillRect(600,110,350,350);
  ctx.restore();

  // 電腦外框
  r(720,247,112,69,"#07101b");
  r(726,253,100,57,"#31505a");
  r(731,258,90,47,"#073b3c");

  // 程式碼
  r(739,265,42,2,"#49d9bb");
  r(739,271,64,2,"#248e80");
  r(739,297,50,2,"#49d9bb");

  if(Math.sin(Date.now()/220)>-0.5){
    text("HACKED",742,290,14,"#a0ffe4");
  }

  r(769,316,13,10,"#4c5a61");
  r(753,326,45,4,"#3c4853");

  // ===== 桌燈 =====
  r(689,272,8,39,"#8b8d89");
  r(673,257,39,17,"#c4a36b");
  r(678,273,29,4,"#f2cf91");

 

  // ===== 中央木製樓梯 V3：上窄下寬 =====

  const stairCenter = 470;
  const stairTop = 174;
  const stepH = 46;

  // 後方陰影
  r(376, 176, 188, 237, "#17202b");

  // 五階樓梯：由上往下逐漸變寬
  for (let i = 0; i < 5; i++) {
    const w = 100 + i * 20;
    const x = stairCenter - w / 2;
    const y = stairTop + i * stepH;

    // 階梯側邊深色結構
    r(x - 6, y + 5, w + 12, stepH, "#604630");

    // 階梯正面
    r(x, y + 9, w, stepH - 9,
      i % 2 === 0 ? "#a58059" : "#96714d");

    // 踏板頂部
    r(x - 4, y, w + 8, 12, "#d2aa79");

    // 踏板高光
    r(x - 2, y + 2, w + 4, 3, "#f0c995");

    // 踏板厚度
    r(x - 4, y + 10, w + 8, 6, "#79583e");

    // 木紋
    r(x + 15, y + 23, w * 0.35, 2, "#c49a6d");
    r(x + w * 0.55, y + 32, w * 0.23, 2, "#79593f");

    // 階梯底部陰影
    r(x, y + stepH - 5, w, 5, "#523b2b");
  }

  // 左右側板：跟著樓梯逐漸向外展開

  // ====================================
  // 對話
  // ====================================

  function showDialogue(message) {
    dialogue.style.display = "block";
    dialogue.textContent = message;
  }

  function hideDialogue() {
    dialogue.style.display = "none";
  }

  // ====================================
  // 開始遊戲
  // ====================================

  function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(
      screen => screen.classList.remove("active")
    );
  }


let transitionStart = 0;
  function startGame() {
  hideAllScreens();

puzzleMusic.currentTime = 0;
puzzleMusic.play().catch(err => {
  console.log("解謎音樂播放失敗：", err);
});
    
  gameStarted = false;
  animationTime = 0;
  clueShown = false;

  player.x = 120;
  player.state = "idle";

  hideDialogue();

  const flash = document.getElementById("flash");

  // 白光閃過，逐漸露出宿舍
  flash.classList.remove("active");
    transitionStart = performance.now();
  void flash.offsetWidth;
  flash.classList.add("active");

  // 2 秒後主角漸漸出現
  canvas.style.opacity = "1";

  // 4 秒後才開始走路
  setTimeout(() => {
    player.state = "walking";
    gameStarted = true;
    showDialogue("主角：電腦好像被入侵了……");
  }, 4000);
}


  // ====================================
  // 主角自動走路與撿拾
  // ====================================

  let clueShown = false;

  function updatePlayer() {

    if (!gameStarted) return;

    animationTime++;

    if (player.state === "walking") {

      player.x += player.speed;

      if (player.x >= player.targetX) {
        player.x = player.targetX;
        player.state = "investigating";

        showDialogue(
          "主角：奇怪……地上怎麼有東西？"
        );
      }
    }

    if (player.state === "investigating") {

      if (animationTime > 260) {
        player.state = "picking";
        showDialogue("主角：這是什麼線索？");
      }
    }

    if (player.state === "picking") {

      if (animationTime > 340 && !clueShown) {
        clueShown = true;
        player.state = "finished";

        hideDialogue();

        setTimeout(showClues, 800);
      }
    }
  }

  // ====================================
  // 同時顯示兩個線索
  // ====================================

  function showClues() {
    gameStarted = false;
    hideAllScreens();

    document
      .getElementById("clueScreen")
      .classList.add("active");
  }

  // ====================================
  // 四位嫌疑人
  // ====================================

 function showSuspects() {
  hideAllScreens();

  document.getElementById("suspectScreen")
    .classList.add("active");

  const list = document.getElementById("suspectList");
  list.innerHTML = "";

  suspects.forEach((suspect, index) => {
    const card = document.createElement("div");
    card.className = "suspect";

    if (selectedSuspect === index) {
      card.classList.add("selected");
    }

    // 頭像
    const avatar = document.createElement("img");
    avatar.src = suspect.image;
    avatar.className = "suspect-avatar";
    avatar.alt = "嫌疑犯頭像";

    avatar.onclick = () => {
      selectedSuspect = index;
      showSuspects();
    };

    // 播放／暫停
    const playButton = document.createElement("button");
    playButton.className = "suspect-play-btn";
    playButton.dataset.index = index;

    playButton.textContent =
      currentAudio &&
      currentSuspectIndex === index &&
      !currentAudio.paused
        ? "⏸ 暫停"
        : "▶ 播放";

    playButton.onclick = () => playMusic(index);

    const selectText = document.createElement("p");
    selectText.textContent =
      selectedSuspect === index ? "✓ 已選擇" : "點擊頭像選擇";

    card.appendChild(avatar);
    card.appendChild(playButton);
    card.appendChild(selectText);

    list.appendChild(card);
  });
}

  // ====================================
  // 播放音樂
  // ====================================

function updatePlayButtons() {
  document.querySelectorAll(".suspect-play-btn").forEach(btn => {
    const i = Number(btn.dataset.index);

    btn.textContent =
      currentAudio &&
      currentSuspectIndex === i &&
      !currentAudio.paused
        ? "⏸ 暫停"
        : "▶ 播放";
  });
}

function playMusic(index) {

  // 同一位嫌疑犯：暫停或繼續
  if (currentAudio && currentSuspectIndex === index) {
    const audio = currentAudio;

    if (!audio.paused) {
      fadeAudio(audio, audio.volume, 0, 500, () => {
        audio.pause();
        updatePlayButtons();
      });
    } else {
      audio.play().then(() => {
        fadeAudio(audio, audio.volume, 1, 500);
        updatePlayButtons();
      }).catch(console.error);
    }
    return;
  }

  // 背景音樂淡出
  fadeAudio(puzzleMusic, puzzleMusic.volume, 0, 2000, () => {
    puzzleMusic.pause();
  });

  // 前一位嫌疑犯淡出
  if (currentAudio) {
    const oldAudio = currentAudio;
    oldAudio.onended = null;

    fadeAudio(oldAudio, oldAudio.volume, 0, 1000, () => {
      oldAudio.pause();
      oldAudio.currentTime = 0;
    });
  }

  // 新嫌疑犯音樂淡入
  const newAudio = new Audio(suspects[index].audio);

  currentAudio = newAudio;
  currentSuspectIndex = index;
  newAudio.volume = 0;

  newAudio.play().then(() => {
    fadeAudio(newAudio, 0, 1, 2000);
    updatePlayButtons();
  }).catch(console.error);

  // 播放結束後，恢復解謎音樂
  newAudio.onended = () => {
    if (currentAudio !== newAudio) return;

    currentAudio = null;
    currentSuspectIndex = -1;
    updatePlayButtons();

    puzzleMusic.volume = 0;
    puzzleMusic.play().then(() => {
      fadeAudio(puzzleMusic, 0, 0.3, 2000);
    }).catch(console.error);
  };

  updatePlayButtons();
}

  // ====================================
  // 確認駭客身分
  // ====================================

 
function confirmSuspect() {

  // 沒有選擇嫌疑犯
  if (selectedSuspect === -1) {
    alert("請先選擇一位嫌疑人！");
    return;
  }

  // 選錯：提示玩家繼續調查
  if (selectedSuspect !== correctSuspect) {
    alert("指認錯誤！請再仔細聆聽音樂，繼續尋找真正的駭客！");
    selectedSuspect = -1;
    showSuspects();
    return;
  }

 // 選對：立即停止嫌疑犯音樂
if (currentAudio) {
  currentAudio.pause();
  currentAudio.currentTime = 0;
  currentAudio = null;
  currentSuspectIndex = -1;
}

  // 停止解謎背景音樂
  puzzleMusic.pause();
  puzzleMusic.currentTime = 0;

  // 播放成功影片
  playStoryVideo("videos/success.mp4", () => {
    hideAllScreens();

    document.getElementById("resultScreen")
      .classList.add("active");

    document.getElementById("resultText").textContent =
      "成功找出真正的駭客！";
  });
}

if (!gameStarted && player.state === "idle") {
  const flash = document.getElementById("flash");

  if (flash.classList.contains("active")) {

  }
}

drawPlayer();
ctx.globalAlpha = 1;

  }

  gameLoop();
