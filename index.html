<script type="module">
  
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
  
import {
  getDatabase,
  ref,
  set,
  get,
  onValue
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

import {
  firebaseConfig,
  ADMIN_UID
} from "./firebase-config.js";

const firebaseApp = initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);
const firebaseDB = getDatabase(firebaseApp);

// 讓 Firebase 記住登入狀態
const authReady = setPersistence(
  firebaseAuth,
  browserLocalPersistence
);

// 自動檢查主持人是否已經登入
onAuthStateChanged(firebaseAuth, async (user) => {
  await authReady;

  const loginScreen = document.getElementById("adminLogin");
  const startScreen = document.getElementById("start");
  const message = document.getElementById("adminLoginMessage");

  if (user && user.uid === ADMIN_UID) {
    loginScreen.classList.remove("active");
    startScreen.classList.add("active");
  } else {
    startScreen.classList.remove("active");
    loginScreen.classList.add("active");

    if (user && user.uid !== ADMIN_UID) {
      await signOut(firebaseAuth);
      message.textContent = "這個帳號不是主持人帳號";
    }
  }
});

// 手動登入（第一次登入時使用）
async function loginAdmin() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;
  const message = document.getElementById("adminLoginMessage");

  message.textContent = "登入中……";

  try {
    await authReady;

    const credential = await signInWithEmailAndPassword(
      firebaseAuth,
      email,
      password
    );

    if (credential.user.uid !== ADMIN_UID) {
      await signOut(firebaseAuth);
      message.textContent = "這個帳號不是主持人帳號";
      return;
    }

    document.getElementById("adminLogin").classList.remove("active");
    document.getElementById("start").classList.add("active");

  } catch (error) {
    console.error(error);
    message.textContent = "登入失敗，請檢查帳號與密碼";
  }
}

window.loginAdmin = loginAdmin;

  // ===== 進入全螢幕，按 Esc 退出 =====

async function toggleFullscreen() {
  const game = document.getElementById("game");
  const button = document.getElementById("fullscreenButton");

  try {
    if (!document.fullscreenElement) {
      await game.requestFullscreen();
      button.style.setProperty("display", "none", "important");
    } else {
      await document.exitFullscreen();
      button.style.removeProperty("display");
    }
  } catch (error) {
    console.error("切換全螢幕失敗：", error);
  }
}

window.toggleFullscreen = toggleFullscreen;
  // ===== 全螢幕時隱藏按鈕，退出後顯示 =====
document.addEventListener("fullscreenchange", () => {
  const button = document.getElementById("fullscreenButton");

  if (document.fullscreenElement) {
    button.style.setProperty("display", "none", "important");
  } else {
    button.style.removeProperty("display");
  }
});
  
  const voteURL = new URL("vote.html", window.location.href).href;

document.getElementById("voteQRCode").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
  encodeURIComponent(voteURL);
  // ====================================
  // 基本設定
  // ====================================

 const storyVideo = document.getElementById("storyVideo");

let videoNextAction = null;


function playStoryVideo(filename, nextAction) {
  hideAllScreens();

  const videoScreen = document.getElementById("videoScreen");
  videoScreen.classList.add("active");

  videoNextAction = nextAction;

  storyVideo.src = filename;
  storyVideo.load();

  storyVideo.play().catch(error => {
    console.error("影片播放失敗：", error);

    document.getElementById("videoTransition")
      .classList.remove("active");

    alert("影片無法播放：" + error.message);
  });
}


function finishCurrentVideo() {
  storyVideo.pause();
  storyVideo.removeAttribute("src");
  storyVideo.load();

  const next = videoNextAction;
  videoNextAction = null;

  if (next) next();
}


// 播放影片時，按空白鍵跳過影片
document.addEventListener("keydown", (event) => {
  if (event.code !== "Space" || event.repeat) return;

  const videoScreen = document.getElementById("videoScreen");

  // 只有影片畫面正在顯示時才能跳過
  if (!videoScreen.classList.contains("active")) return;

  event.preventDefault();
  finishCurrentVideo();
});

storyVideo.addEventListener("ended", () => {
  // 結局影片播放完後，保留最後畫面
  if (videoNextAction === null) return;

  finishCurrentVideo();
});


function startOpening() {

  // 播放 Start 按鈕音效
  startButtonSound.currentTime = 0;
  startButtonSound.play().catch(console.error);

  // 按下 Start 時，自動進入全螢幕
  const game = document.getElementById("game");

  if (!document.fullscreenElement) {
    game.requestFullscreen().catch(error => {
      console.error("無法進入全螢幕：", error);
    });
  }

  const transition = document.getElementById("videoTransition");

  if (transition.classList.contains("active")) return;

  // 開始白光漸亮
  transition.classList.add("active");

  // 白光完全覆蓋後再切換影片
  setTimeout(() => {
   const onVideoPlaying = () => {
  storyVideo.removeEventListener("playing", onVideoPlaying);

// 音樂淡入淡出（預設 2 秒）
const fadeTimers = new WeakMap();

function fadeAudio(audio, from, to, duration = 2000, onComplete = null) {
  if (!audio) return;

  // 取消同一首音樂正在進行的淡入淡出
  if (fadeTimers.has(audio)) {
    clearInterval(fadeTimers.get(audio));
  }

  const start = performance.now();
  audio.volume = from;

  const timer = setInterval(() => {
    const progress = Math.min(
      (performance.now() - start) / duration, 1
    );

    audio.volume = Math.max(
      0,
      Math.min(1, from + (to - from) * progress)
    );

    if (progress >= 1) {
      clearInterval(timer);
      fadeTimers.delete(audio);
      if (onComplete) onComplete();
    }
  }, 30);

  fadeTimers.set(audio, timer);
}

  // ====================================
  // 同時顯示兩個線索
  // ====================================


async function showClues() {
  if (gameOver) return;

  if (!firebaseAuth.currentUser ||
      firebaseAuth.currentUser.uid !== ADMIN_UID) {
    alert("請先登入主持人帳號");
    return;
  }

  gameStarted = false;

  const sessionId = "round_" + Date.now();
  const startedAt = Date.now();
  const endsAt = startedAt + 300000;

  votingEndsAt = endsAt;

  try {
    // 建立五分鐘投票場次
    await set(ref(firebaseDB, "sessions/" + sessionId + "/config"), {
      startedAt,
      endsAt,
      status: "open"
    });

    // 更新目前投票場次
    await set(ref(firebaseDB, "currentSession"), sessionId);

   
        // ===== 白光過場進入提示頁面 =====
    const transition = document.getElementById("videoTransition");
    const timer = document.getElementById("timer");

    // 過場期間隱藏計時器及公布結果按鈕
    timer.style.display = "none";
    document.getElementById("revealResultsButton").style.display = "none";

    // 白光逐漸覆蓋畫面
    transition.classList.add("active");

    setTimeout(() => {

      // 切換提示畫面
      hideAllScreens();

      document.getElementById("clueScreen")
        .classList.add("active");

      // 背景音樂淡入
      puzzleMusic.pause();
      puzzleMusic.currentTime = 0;
      puzzleMusic.volume = 0;
      puzzleMusic.loop = true;

      puzzleMusic.play().then(() => {
        fadeAudio(puzzleMusic, 0, 0.3, 2000);
      }).catch(error => {
        console.error("背景音樂播放失敗：", error);
      });

      // 白光開始淡出
      requestAnimationFrame(() => {
        transition.classList.remove("active");
      });

      // 等白光完全退去，再顯示倒數計時器
      setTimeout(() => {

        startTimer();

        // 公布結果按鈕保持隱藏，改用空白鍵
        document.getElementById("revealResultsButton")
          .style.display = "none";

      }, 1500);

    }, 1500);

  } catch (error) {
    console.error("建立投票場次失敗：", error);
    alert("無法開始投票，請檢查 Firebase 設定與網路連線");
  }
}

// 四首音樂只建立一次
const suspectAudios = suspects.map(suspect => {
  const audio = new Audio(suspect.audio);
  audio.preload = "auto";
  audio.volume = 1;

  audio.addEventListener("error", () => {
    console.error("音樂載入失敗：", suspect.audio);
  });

  return audio;
});

// 預先載入四首音樂
function preloadSuspectMusic() {
  suspectAudios.forEach(audio => {
    audio.load();
  });
}

  
 function showSuspects() {
  hideAllScreens();

  document.getElementById("suspectScreen")
    .classList.add("active");

  const list = document.getElementById("suspectList");
  list.innerHTML = "";

  suspects.forEach((suspect, index) => {
    const card = document.createElement("div");
    card.className = "suspect";

    if (selectedSuspect === index) {
      card.classList.add("selected");
    }

    // 頭像
    const avatar = document.createElement("img");
    avatar.src = suspect.image;
    avatar.className = "suspect-avatar";
    avatar.alt = "嫌疑犯頭像";

    avatar.onclick = () => {
      selectedSuspect = index;
      showSuspects();
    };

    // 播放／暫停
    const playButton = document.createElement("button");
    playButton.className = "suspect-play-btn";
    playButton.dataset.index = index;

    playButton.textContent =
      currentAudio &&
      currentSuspectIndex === index &&
      !currentAudio.paused
        ? "⏸ 暫停"
        : "▶ 播放";

    playButton.onclick = () => playMusic(index);

    const selectText = document.createElement("p");
    selectText.textContent =
      selectedSuspect === index ? "✓ 已選擇" : "點擊頭像選擇";

    card.appendChild(avatar);
    card.appendChild(playButton);
    card.appendChild(selectText);

    list.appendChild(card);
  });
}

  // ====================================
  // 播放音樂
  // ====================================

function updatePlayButtons() {
  document.querySelectorAll(".suspect-play-btn").forEach(btn => {
    const i = Number(btn.dataset.index);

    btn.textContent =
      currentAudio &&
      currentSuspectIndex === i &&
      !currentAudio.paused
        ? "⏸ 暫停"
        : "▶ 播放";
  });
}


function playMusic(index) {

  const newAudio = suspectAudios[index];

  // 同一首音樂：播放或暫停
  if (currentAudio === newAudio) {

    if (!newAudio.paused) {
      newAudio.pause();
      updatePlayButtons();
    } else {
      newAudio.play()
        .then(updatePlayButtons)
        .catch(console.error);
    }

    return;
  }

  // 停止背景音樂
  if (fadeTimers.has(puzzleMusic)) {
    clearInterval(fadeTimers.get(puzzleMusic));
    fadeTimers.delete(puzzleMusic);
  }

  puzzleMusic.pause();

  // 停止上一首嫌疑犯音樂
  if (currentAudio) {

    if (fadeTimers.has(currentAudio)) {
      clearInterval(fadeTimers.get(currentAudio));
      fadeTimers.delete(currentAudio);
    }

    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio.onended = null;
  }

  // 使用已預先載入的音樂
  currentAudio = newAudio;
  currentSuspectIndex = index;

  newAudio.currentTime = 0;
  newAudio.volume = 0;

  newAudio.play().then(() => {

    // 只淡入 0.3 秒
    fadeAudio(newAudio, 0, 1, 300);

    updatePlayButtons();

  }).catch(error => {
    console.error("嫌疑犯音樂播放失敗：", error);
  });

  // 音樂播放結束
  newAudio.onended = () => {

    if (currentAudio !== newAudio) return;

    currentAudio = null;
    currentSuspectIndex = -1;

    updatePlayButtons();

    // 恢復解謎背景音樂
    puzzleMusic.volume = 0;

    puzzleMusic.play().then(() => {
      fadeAudio(puzzleMusic, 0, 0.3, 1000);
    }).catch(console.error);
  };

  updatePlayButtons();
}


  // ====================================
  // 確認駭客身分
  // ====================================

 
function confirmSuspect() {
  if (gameOver) return;

  // 沒有選擇嫌疑犯
  if (selectedSuspect === -1) {
    alert("請先選擇一位嫌疑人！");
    return;
  }

  // 選錯：提示玩家繼續調查
  if (selectedSuspect !== correctSuspect) {
    alert("指認錯誤！請再仔細聆聽音樂，繼續尋找真正的駭客！");
    selectedSuspect = -1;
    showSuspects();
    return;
  }

stopTimer();
document.getElementById("timer").style.display = "none";
  
 // 選對：立即停止嫌疑犯音樂
if (currentAudio) {
  currentAudio.pause();
  currentAudio.currentTime = 0;
  currentAudio = null;
  currentSuspectIndex = -1;
}

  // 停止解謎背景音樂
  puzzleMusic.pause();
  puzzleMusic.currentTime = 0;

  // 播放成功影片
  playStoryVideo("videos/success.mp4", () => {
    hideAllScreens();

    document.getElementById("resultScreen")
      .classList.add("active");

    document.getElementById("resultText").textContent =
      "成功找出真正的駭客！";
  });
}

  // ====================================
  // 遊戲主迴圈
  // ====================================


function gameLoop() {
  ctx.clearRect(0, 0, 960, 540);

  drawRoom();
  updatePlayer();
  drawPlayer();

  requestAnimationFrame(gameLoop);
}


  // 初始化
  gameLoop();

  window.startOpening = startOpening;
window.showSuspects = showSuspects;
window.confirmSuspect = confirmSuspect;

</script>
