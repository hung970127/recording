
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錄音期中：駭客在哪裡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c18;
      color: white;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #game {
      position: relative;
      width: min(100vw, 177.78vh);
      aspect-ratio: 16 / 9;
      background: #151d32;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 25, 0.94);
      padding: 30px;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: clamp(24px, 4vw, 48px);
      color: #92d8ff;
    }

    h2 {
      color: #e9d6a7;
    }

    button {
      padding: 12px 22px;
      margin: 8px;
      border: 2px solid #91c8ee;
      background: #263954;
      color: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #426b91;
    }

    #dialogue {
      position: absolute;
      bottom: 4%;
      left: 8%;
      width: 84%;
      padding: 18px;
      background: rgba(9, 15, 30, 0.95);
      border: 3px solid #9abbd1;
      font-size: clamp(12px, 2vw, 20px);
      display: none;
    }

    .clues {
      display: flex;
      gap: 20px;
      width: 90%;
      justify-content: center;
    }

    .clue {
      width: 45%;
      min-height: 180px;
      padding: 20px;
      background: #e6ddc7;
      color: #252332;
      border: 5px solid #9e8a6d;
    }

    .suspects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 85%;
    }

    .suspect {
      padding: 10px;
      background: #202c43;
      border: 2px solid #647b9c;
    }

    .suspect.selected {
      border-color: #ffe18c;
      background: #3b4963;
    }

    .suspect button {
      font-size: 13px;
      padding: 8px;
    }

    #resultText {
      font-size: 22px;
      margin: 20px;
    }

  
#flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}

#flash.active {
  animation: whiteFlash 3s ease-out forwards;
}

@keyframes whiteFlash {
  0%   { opacity: 1; }
  15%  { opacity: 1; }
  100% { opacity: 0; }
}

  
  </style>
</head>

<body>

<div id="game">

<div id="videoScreen" class="screen">
  <video
    id="storyVideo"
    playsinline
    style="width:100%;height:100%;object-fit:contain;"
  ></video>

  <button
    onclick="skipCurrentVideo()"
    style="position:absolute;right:20px;bottom:20px;"
  >
    跳過影片
  </button>
</div>
  
  <canvas id="canvas" width="960" height="540"></canvas>

  <div id="dialogue"></div>
<div id="flash"></div>
  
  <!-- 開始畫面 -->
  <div id="start" class="screen active">
    <h1>錄音期中</h1>
    <h2>駭客在哪裡</h2>
    <p>去調查啦幹</p>
    <button onclick="startOpening()">開始遊戲</button>
  </div>

  <!-- 兩個線索同時顯示 -->
  <div id="clueScreen" class="screen">
    <h2>發現神祕線索</h2>

    <div class="clues">

      <div class="clue">
        <h2>✉ 信封</h2>
        <p>線索一</p>
        <p>調性：E 小調</p>
        <p>這裡可以放你們真正的謎題</p>
      </div>

      <div class="clue">
        <h2>⚿ 鑰匙與便條紙</h2>
        <p>線索二</p>
        <p>這裡可以放節奏或旋律提示</p>
        <p>讓觀眾還原駭客的樂譜</p>
      </div>

    </div>

    <button onclick="showSuspects()">
      繼續調查
    </button>
  </div>

  <!-- 嫌疑人選擇 -->
  <div id="suspectScreen" class="screen">
    <h2>找出真正的駭客</h2>
    <p>請聆聽四位嫌疑人的專屬音樂</p>

    <div class="suspects" id="suspectList"></div>

    <button onclick="confirmSuspect()">
      確認指認
    </button>
  </div>

  <!-- 結局 -->
  <div id="resultScreen" class="screen">
    <h1>調查結果</h1>
    <div id="resultText"></div>
    <button onclick="showSuspects()">重新選擇</button>
    <button onclick="location.reload()">重新開始</button>
  </div>

</div>

<script>
  // ====================================
  // 基本設定
  // ====================================

 const storyVideo = document.getElementById("storyVideo");

let videoNextAction = null;

function playStoryVideo(filename, nextAction) {
  hideAllScreens();

  document.getElementById("videoScreen")
    .classList.add("active");

  videoNextAction = nextAction;

  storyVideo.src = filename;
  storyVideo.currentTime = 0;
  storyVideo.play();
}

function finishCurrentVideo() {
  storyVideo.pause();
  storyVideo.removeAttribute("src");
  storyVideo.load();

  const next = videoNextAction;
  videoNextAction = null;

  if (next) next();
}

function skipCurrentVideo() {
  finishCurrentVideo();
}

storyVideo.addEventListener("ended", finishCurrentVideo);


function startOpening() {
  playStoryVideo(
    "videos/redpandacompress_IMG_2480 - Compressed with FlexClip.mp4",
    () => {
      startGame();
    }
  );
}
  
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;

  const dialogue = document.getElementById("dialogue");

  let gameStarted = false;
  let animationTime = 0;
  let selectedSuspect = -1;
  let currentAudio = null;

  // 真正的駭客是羅思穎，編號 0
  const correctSuspect = 0;

  const suspects = [
    {
      name: "羅思穎",
      instrument: "電子音樂",
      audio: "music/hacker.mp3"
    },
    {
      name: "許宸瑋",
      instrument: "中提琴",
      audio: "music/viola.mp3"
    },
    {
      name: "周裕軒",
      instrument: "人聲",
      audio: "music/vocal.mp3"
    },
    {
      name: "洪昕妤",
      instrument: "木吉他",
      audio: "music/guitar.mp3"
    }
  ];

  // ====================================
  // 畫圖工具
  // ====================================

  function rectangle(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(
      Math.round(x),
      Math.round(y),
      w,
      h
    );
  }

  function text(str, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = size + "px monospace";
    ctx.fillText(str, x, y);
  }

  // ====================================
  // 繪製 2D 宿舍
  // ====================================

 

function drawRoom() {
  // =========================================
  // 2D 像素宿舍：正面視角、深夜懸疑風
  // =========================================

  const r = rectangle;

  // 畫多邊形：用於階梯踏面
  function polygon(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
    ctx.fill();
  }

  // ===== 背景牆壁 =====
  r(0, 0, 960, 540, "#101725");
  r(0, 0, 960, 112, "#111b2c");

  // 牆面像素磚紋
  for (let y = 18; y < 112; y += 28) {
    r(0, y, 960, 2, "#26364b");
    for (let x = (y % 56 === 18 ? 0 : -40);
         x < 960; x += 80) {
      r(x, y + 2, 2, 26, "#1d2b3e");
    }
  }

  // 牆壁底部
  r(0, 107, 960, 9, "#3b4b61");
  r(0, 113, 960, 5, "#0a101d");

  // ===== 地板 =====
  r(0, 118, 960, 422, "#19263a");

  for (let y = 118; y < 540; y += 48) {
    for (let x = 0; x < 960; x += 48) {
      const alternate =
        (Math.floor(x / 48) + Math.floor(y / 48)) % 2;

      r(x + 1, y + 1, 46, 46,
        alternate ? "#202e44" : "#1b293d");

      r(x + 2, y + 2, 44, 2, "#29384e");
      r(x + 2, y + 45, 44, 2, "#121e30");
    }
  }

  // 房間四周陰影
  r(0, 118, 22, 422, "rgba(0,0,0,0.25)");
  r(938, 118, 22, 422, "rgba(0,0,0,0.25)");

  // =========================================
  // 左右兩組上舖
  // =========================================

  function drawLoftBed(x, rightSide = false) {
    const bedWidth = 286;

    // 床下陰影
    r(x + 8, 225, 270, 177, "#111b2a");

    // 後方金屬支架
    r(x + 5, 119, 12, 286, "#536478");
    r(x + 269, 119, 12, 286, "#536478");

    // 金屬高光
    r(x + 7, 119, 3, 286, "#9ba8b5");
    r(x + 271, 119, 3, 286, "#9ba8b5");

    // 上舖床板
    r(x, 207, bedWidth, 27, "#513d35");
    r(x + 4, 207, bedWidth - 8, 7, "#bc9568");
    r(x + 4, 215, bedWidth - 8, 11, "#8a6748");
    r(x + 4, 226, bedWidth - 8, 8, "#392e30");

    // 床墊
    r(x + 17, 167, 252, 40, "#8b9db1");
    r(x + 17, 199, 252, 8, "#566a85");

    // 枕頭
    const pillowX = rightSide ? x + 195 : x + 24;
    r(pillowX, 173, 58, 28, "#bfc5ce");
    r(pillowX + 4, 176, 50, 22, "#e3dfd5");
    r(pillowX + 8, 180, 42, 2, "#f6efe4");

    // 棉被
    const blanketX = rightSide ? x + 20 : x + 91;
    r(blanketX, 173, 163, 29, "#506c91");
    r(blanketX, 173, 163, 5, "#8fa5bf");
    r(blanketX + 10, 191, 143, 3, "#405978");

    // 床頭木框
    r(x + 3, 121, 12, 89, "#95714f");
    r(x + 271, 121, 12, 89, "#95714f");

    // 上方橫向護欄
    r(x + 3, 120, 280, 11, "#b48b60");
    r(x + 3, 120, 280, 3, "#e0b681");

    // 護欄直條
    for (let i = 0; i < 5; i++) {
      const px = x + 48 + i * 42;
      r(px, 131, 10, 74, "#9a7755");
      r(px + 2, 131, 3, 74, "#cba174");
    }

    // 床下橫樑
    r(x + 12, 234, 262, 9, "#55463e");
    r(x + 12, 234, 262, 3, "#826a55");

    // 床腳
    r(x + 5, 243, 12, 162, "#566478");
    r(x + 269, 243, 12, 162, "#566478");

    // 地面接觸陰影
    r(x + 2, 405, 22, 6, "#0b1421");
    r(x + 263, 405, 22, 6, "#0b1421");
  }

  drawLoftBed(42, false);
  drawLoftBed(632, true);

  // =========================================
  // 左右書桌
  // =========================================

  function drawDesk(x, hacked = false) {
    // 桌面
    r(x, 312, 230, 22, "#795a47");
    r(x, 312, 230, 5, "#c09a70");
    r(x, 329, 230, 5, "#493b3b");

    // 桌腳
    r(x + 12, 334, 13, 82, "#55454a");
    r(x + 207, 334, 13, 82, "#55454a");

    // 抽屜櫃
    const cabinetX = hacked ? x + 150 : x + 15;
    r(cabinetX, 335, 64, 68, "#55434a");
    r(cabinetX + 4, 340, 56, 27, "#7a6060");
    r(cabinetX + 4, 371, 56, 27, "#7a6060");

    // 抽屜把手
    r(cabinetX + 26, 351, 12, 4, "#d2b38d");
    r(cabinetX + 26, 382, 12, 4, "#d2b38d");

    // 電腦螢幕外框
    const mx = x + 80;
    r(mx - 5, 246, 112, 70, "#080e19");
    r(mx, 251, 102, 59, "#344754");
    r(mx + 5, 256, 92, 49,
      hacked ? "#063e3f" : "#1d5164");

    // 螢幕內容
    if (hacked) {
      r(mx + 12, 262, 42, 2, "#3dd5af");
      r(mx + 12, 269, 68, 2, "#218b79");
      r(mx + 12, 296, 54, 2, "#3dd5af");

      if (Math.sin(Date.now() / 180) > -0.4) {
        text("HACKED", mx + 16, 287, 15, "#a0ffe2");
      }
    } else {
      r(mx + 12, 265, 56, 3, "#62b5c5");
      r(mx + 12, 274, 70, 2, "#357d92");
      r(mx + 12, 281, 40, 2, "#62b5c5");
      r(mx + 12, 289, 61, 2, "#357d92");
    }

    // 螢幕支架
    r(mx + 45, 316, 12, 7, "#46515d");
    r(mx + 31, 323, 40, 4, "#46515d");

    // 鍵盤
    r(x + 76, 333, 115, 10, "#151e2b");
    r(x + 81, 335, 105, 3, "#657484");

    // 滑鼠
    r(x + 198, 333, 12, 8, "#394655");

    // 椅子：正面 2D
    r(x + 85, 355, 62, 42, "#28384d");
    r(x + 90, 359, 52, 34, "#4b607b");
    r(x + 80, 396, 72, 10, "#293b52");
    r(x + 91, 406, 8, 24, "#47546a");
    r(x + 135, 406, 8, 24, "#47546a");
  }

  drawDesk(69, false);
  drawDesk(660, true);

  // =========================================
  // 中央樓梯：從正面看往上走
  // =========================================

  // 樓梯後方深色空間
  r(365, 124, 230, 290, "#131d2c");

  // 左右樓梯側板
  polygon([
    [373, 411],
    [425, 176],
    [437, 176],
    [397, 411]
  ], "#79583e");

  polygon([
    [563, 411],
    [523, 176],
    [535, 176],
    [587, 411]
  ], "#79583e");

  // 樓梯側板高光
  polygon([
    [377, 411],
    [428, 176],
    [433, 176],
    [388, 411]
  ], "#b48b61");

  polygon([
    [572, 411],
    [527, 176],
    [532, 176],
    [583, 411]
  ], "#b48b61");

  // 樓梯本體
  polygon([
    [397, 410],
    [437, 183],
    [523, 183],
    [563, 410]
  ], "#634b39");

  // 五階踏板：上方較窄、下方較寬
  const stairs = [
    { y: 190, left: 434, right: 526, h: 20 },
    { y: 225, left: 427, right: 533, h: 25 },
    { y: 266, left: 419, right: 541, h: 30 },
    { y: 314, left: 410, right: 550, h: 35 },
    { y: 370, left: 400, right: 560, h: 39 }
  ];

  stairs.forEach((s, i) => {
    const spread = 5 + i * 2;

    // 階梯正面
    polygon([
      [s.left, s.y],
      [s.right, s.y],
      [s.right + spread, s.y + s.h],
      [s.left - spread, s.y + s.h]
    ], "#9c7652");

    // 踏面
    polygon([
      [s.left + 3, s.y - 8],
      [s.right - 3, s.y - 8],
      [s.right, s.y],
      [s.left, s.y]
    ], "#d5ad7b");

    // 踏板亮邊
    r(s.left, s.y, s.right - s.left, 4, "#e0b987");

    // 正面陰影
    r(s.left, s.y + s.h - 5,
      s.right - s.left, 5, "#654832");

    // 木紋
    r(s.left + 14, s.y + 12,
      s.right - s.left - 35, 2, "#bc9469");
  });

  // 樓梯底座
  r(390, 408, 180, 9, "#48372e");
  r(390, 408, 180, 3, "#a47e58");

  // =========================================
  // 地毯
  // =========================================

  r(316, 435, 328, 75, "#28334c");
  r(323, 442, 314, 61, "#455573");
  r(333, 451, 294, 43, "#34445f");

  // 地毯邊框
  r(323, 442, 314, 3, "#7c8da8");
  r(323, 500, 314, 3, "#202b40");

  // =========================================
  // 駭客電腦的青綠色光暈
  // =========================================

  ctx.save();

  const glow = 0.85 + Math.sin(Date.now() / 350) * 0.15;

  const light = ctx.createRadialGradient(
    790, 280, 8,
    790, 280, 160
  );

  light.addColorStop(
    0,
    `rgba(0, 235, 190, ${0.18 * glow})`
  );
  light.addColorStop(1, "rgba(0, 235, 190, 0)");

  ctx.fillStyle = light;
  ctx.fillRect(630, 120, 330, 340);

  ctx.restore();

  // =========================================
  // 信封、鑰匙、線索提示
  // =========================================

  // 信封
  r(588, 443, 44, 29, "#9f8f79");
  r(591, 445, 38, 24, "#e7d9b9");
  r(596, 451, 28, 2, "#bca587");
  r(603, 459, 15, 2, "#a88e74");

  // 鑰匙
  r(645, 456, 26, 6, "#e2c16e");
  r(642, 450, 13, 13, "#e2c16e");
  r(646, 454, 5, 5, "#35445a");
  r(664, 461, 4, 8, "#e2c16e");

  // 線索驚嘆號
  if (Math.floor(Date.now() / 400) % 2 === 0) {
    text("!", 605, 434, 24, "#ffe08a");
  }
}


  // ====================================
  // 主角
  // ====================================

  const player = {
    x: 120,
    y: 400,
    targetX: 575,
    speed: 2.2,
    state: "walking"
  };

  function drawPlayer() {

    const x = player.x;
    const y = player.y;

    // 影子
    rectangle(x + 3, y + 58, 38, 8, "#17202e");

    // 頭髮
    rectangle(x + 8, y, 27, 17, "#25202d");

    // 臉
    rectangle(x + 11, y + 12, 23, 20, "#e1b18e");

    // 眼睛
    rectangle(x + 27, y + 19, 4, 4, "#222331");

    // 衣服
    rectangle(x + 5, y + 32, 36, 25, "#718eb3");

    // 背包
    rectangle(x, y + 35, 9, 23, "#4b536a");

    // 腳
    let legOffset = 0;

    if (player.state === "walking") {
      legOffset = Math.sin(animationTime * 0.2) * 5;
    }

    rectangle(
      x + 10,
      y + 57,
      10,
      15 + legOffset,
      "#273044"
    );

    rectangle(
      x + 27,
      y + 57,
      10,
      15 - legOffset,
      "#273044"
    );
  }

  // ====================================
  // 對話
  // ====================================

  function showDialogue(message) {
    dialogue.style.display = "block";
    dialogue.textContent = message;
  }

  function hideDialogue() {
    dialogue.style.display = "none";
  }

  // ====================================
  // 開始遊戲
  // ====================================

  function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(
      screen => screen.classList.remove("active")
    );
  }


let transitionStart = 0;
  function startGame() {
  hideAllScreens();

  gameStarted = false;
  animationTime = 0;
  clueShown = false;

  player.x = 120;
  player.state = "idle";

  hideDialogue();

  const flash = document.getElementById("flash");

  // 白光閃過，逐漸露出宿舍
  flash.classList.remove("active");
    transitionStart = performance.now();
  void flash.offsetWidth;
  flash.classList.add("active");

  // 2 秒後主角漸漸出現
  canvas.style.opacity = "1";

  // 4 秒後才開始走路
  setTimeout(() => {
    player.state = "walking";
    gameStarted = true;
    showDialogue("主角：電腦好像被入侵了……");
  }, 4000);
}


  // ====================================
  // 主角自動走路與撿拾
  // ====================================

  let clueShown = false;

  function updatePlayer() {

    if (!gameStarted) return;

    animationTime++;

    if (player.state === "walking") {

      player.x += player.speed;

      if (player.x >= player.targetX) {
        player.x = player.targetX;
        player.state = "investigating";

        showDialogue(
          "主角：奇怪……地上怎麼有東西？"
        );
      }
    }

    if (player.state === "investigating") {

      if (animationTime > 260) {
        player.state = "picking";
        showDialogue("主角：這是什麼線索？");
      }
    }

    if (player.state === "picking") {

      if (animationTime > 340 && !clueShown) {
        clueShown = true;
        player.state = "finished";

        hideDialogue();

        setTimeout(showClues, 800);
      }
    }
  }

  // ====================================
  // 同時顯示兩個線索
  // ====================================

  function showClues() {
    gameStarted = false;
    hideAllScreens();

    document
      .getElementById("clueScreen")
      .classList.add("active");
  }

  // ====================================
  // 四位嫌疑人
  // ====================================

  function showSuspects() {

    hideAllScreens();

    document
      .getElementById("suspectScreen")
      .classList.add("active");

    const list = document.getElementById("suspectList");

    list.innerHTML = "";

    suspects.forEach((suspect, index) => {

      const card = document.createElement("div");

      card.className = "suspect";

      if (selectedSuspect === index) {
        card.classList.add("selected");
      }

      const title = document.createElement("h3");
      title.textContent = suspect.name;

      const instrument = document.createElement("p");
      instrument.textContent = suspect.instrument;

      const playButton = document.createElement("button");
      playButton.textContent = "▶ 試聽音樂";
      playButton.onclick = () => playMusic(index);

      const selectButton = document.createElement("button");
      selectButton.textContent =
        selectedSuspect === index ? "✓ 已選擇" : "指認此人";

      selectButton.onclick = () => {
        selectedSuspect = index;
        showSuspects();
      };

      card.appendChild(title);
      card.appendChild(instrument);
      card.appendChild(playButton);
      card.appendChild(selectButton);

      list.appendChild(card);
    });
  }

  // ====================================
  // 播放音樂
  // ====================================

  function playMusic(index) {

    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    currentAudio = new Audio(suspects[index].audio);

    currentAudio.play().catch(() => {
      alert(
        "尚未找到音樂檔案，請先加入：" +
        suspects[index].audio
      );
    });
  }

  // ====================================
  // 確認駭客身分
  // ====================================

 
function confirmSuspect() {
  if (selectedSuspect === -1) {
    alert("請先選擇一位嫌疑人！");
    return;
  }

  if (currentAudio) {
    currentAudio.pause();
  }

  const isCorrect = selectedSuspect === correctSuspect;

 const endingVideo = isCorrect
  ? "videos/success.mp4"
  : "videos/failure.mp4";

  playStoryVideo(endingVideo, () => {
    hideAllScreens();

    document.getElementById("resultScreen")
      .classList.add("active");

    document.getElementById("resultText").textContent =
      isCorrect
        ? "成功找出真正的駭客！"
        : "指認錯誤，駭客仍然逍遙法外……";
  });
}


  // ====================================
  // 遊戲主迴圈
  // ====================================

  function gameLoop() {

    ctx.clearRect(0, 0, 960, 540);

    drawRoom();
    updatePlayer();
   
if (!gameStarted && player.state === "idle") {
  const flash = document.getElementById("flash");

  if (flash.classList.contains("active")) {
    const elapsed = performance.now() - transitionStart;
    ctx.globalAlpha = Math.min(1, Math.max(0, (elapsed - 1500) / 1500));
  }
}

drawPlayer();
ctx.globalAlpha = 1;


    requestAnimationFrame(gameLoop);
  }

  // 初始化
  gameLoop();

</script>
