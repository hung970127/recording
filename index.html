
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錄音期中：駭客在哪裡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c18;
      color: white;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #game {
      position: relative;
      width: min(100vw, 177.78vh);
      aspect-ratio: 16 / 9;
      background: #151d32;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 25, 0.94);
      padding: 30px;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: clamp(24px, 4vw, 48px);
      color: #92d8ff;
    }

    h2 {
      color: #e9d6a7;
    }

    button {
      padding: 12px 22px;
      margin: 8px;
      border: 2px solid #91c8ee;
      background: #263954;
      color: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #426b91;
    }

    #dialogue {
      position: absolute;
      bottom: 4%;
      left: 8%;
      width: 84%;
      padding: 18px;
      background: rgba(9, 15, 30, 0.95);
      border: 3px solid #9abbd1;
      font-size: clamp(12px, 2vw, 20px);
      display: none;
    }

    .clues {
      display: flex;
      gap: 20px;
      width: 90%;
      justify-content: center;
    }

    .clue {
      width: 45%;
      min-height: 180px;
      padding: 20px;
      background: #e6ddc7;
      color: #252332;
      border: 5px solid #9e8a6d;
    }

    .suspects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 85%;
    }

    .suspect {
      padding: 10px;
      background: #202c43;
      border: 2px solid #647b9c;
    }

    .suspect.selected {
      border-color: #ffe18c;
      background: #3b4963;
    }

    .suspect button {
      font-size: 13px;
      padding: 8px;
    }

    #resultText {
      font-size: 22px;
      margin: 20px;
    }

  
#flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}

#flash.active {
  animation: whiteFlash 3s ease-out forwards;
}

@keyframes whiteFlash {
  0%   { opacity: 1; }
  15%  { opacity: 1; }
  100% { opacity: 0; }
}

  
  </style>
</head>

<body>

<div id="game">

<div id="videoScreen" class="screen">
  <video
    id="storyVideo"
    playsinline
    style="width:100%;height:100%;object-fit:contain;"
  ></video>

  <button
    onclick="skipCurrentVideo()"
    style="position:absolute;right:20px;bottom:20px;"
  >
    跳過影片
  </button>
</div>
  
  <canvas id="canvas" width="960" height="540"></canvas>

  <div id="dialogue"></div>
<div id="flash"></div>
  
  <!-- 開始畫面 -->
  <div id="start" class="screen active">
    <h1>錄音期中</h1>
    <h2>駭客在哪裡</h2>
    <p>去調查啦幹</p>
    <button onclick="startOpening()">開始遊戲</button>
  </div>

  <!-- 兩個線索同時顯示 -->
  <div id="clueScreen" class="screen">
    <h2>發現神祕線索</h2>

    <div class="clues">

      <div class="clue">
        <h2>✉ 信封</h2>
        <p>線索一</p>
        <p>調性：E 小調</p>
        <p>這裡可以放你們真正的謎題</p>
      </div>

      <div class="clue">
        <h2>⚿ 鑰匙與便條紙</h2>
        <p>線索二</p>
        <p>這裡可以放節奏或旋律提示</p>
        <p>讓觀眾還原駭客的樂譜</p>
      </div>

    </div>

    <button onclick="showSuspects()">
      繼續調查
    </button>
  </div>

  <!-- 嫌疑人選擇 -->
  <div id="suspectScreen" class="screen">
    <h2>找出真正的駭客</h2>
    <p>請聆聽四位嫌疑人的專屬音樂</p>

    <div class="suspects" id="suspectList"></div>

    <button onclick="confirmSuspect()">
      確認指認
    </button>
  </div>

  <!-- 結局 -->
  <div id="resultScreen" class="screen">
    <h1>調查結果</h1>
    <div id="resultText"></div>
    <button onclick="showSuspects()">重新選擇</button>
    <button onclick="location.reload()">重新開始</button>
  </div>

</div>

<script>
  // ====================================
  // 基本設定
  // ====================================

 const storyVideo = document.getElementById("storyVideo");

let videoNextAction = null;

function playStoryVideo(filename, nextAction) {
  hideAllScreens();

  document.getElementById("videoScreen")
    .classList.add("active");

  videoNextAction = nextAction;

  storyVideo.src = filename;
  storyVideo.currentTime = 0;
  storyVideo.play();
}

function finishCurrentVideo() {
  storyVideo.pause();
  storyVideo.removeAttribute("src");
  storyVideo.load();

  const next = videoNextAction;
  videoNextAction = null;

  if (next) next();
}

function skipCurrentVideo() {
  finishCurrentVideo();
}

storyVideo.addEventListener("ended", finishCurrentVideo);


function startOpening() {
  playStoryVideo(
    "videos/redpandacompress_IMG_2480 - Compressed with FlexClip.mp4",
    () => {
      startGame();
    }
  );
}
  
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;

  const dialogue = document.getElementById("dialogue");

  let gameStarted = false;
  let animationTime = 0;
  let selectedSuspect = -1;
  let currentAudio = null;

  // 真正的駭客是羅思穎，編號 0
  const correctSuspect = 0;

  const suspects = [
    {
      name: "羅思穎",
      instrument: "電子音樂",
      audio: "music/hacker.mp3"
    },
    {
      name: "許宸瑋",
      instrument: "中提琴",
      audio: "music/viola.mp3"
    },
    {
      name: "周裕軒",
      instrument: "人聲",
      audio: "music/vocal.mp3"
    },
    {
      name: "洪昕妤",
      instrument: "木吉他",
      audio: "music/guitar.mp3"
    }
  ];

  // ====================================
  // 畫圖工具
  // ====================================

  function rectangle(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(
      Math.round(x),
      Math.round(y),
      w,
      h
    );
  }

  function text(str, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = size + "px monospace";
    ctx.fillText(str, x, y);
  }

  // ====================================
  // 繪製 2D 宿舍
  // ====================================

 
function drawRoom() {

  // ===== 深夜宿舍地板 =====
  rectangle(0, 0, 960, 540, "#101827");

  for (let x = 0; x < 960; x += 48) {
    for (let y = 112; y < 540; y += 48) {
      rectangle(x + 1, y + 1, 46, 46,
        (x / 48 + y / 48) % 2 < 1
          ? "#1a2639" : "#1e2b40");
      rectangle(x + 3, y + 3, 42, 2, "#27354b");
    }
  }

  // ===== 牆壁 =====
  rectangle(0, 0, 960, 112, "#101725");
  rectangle(0, 105, 960, 8, "#34465b");
  rectangle(0, 20, 960, 2, "#1d2b40");
  rectangle(0, 75, 960, 2, "#1d2b40");

  // 牆面陰影
  rectangle(0, 0, 24, 112, "#0b111e");
  rectangle(936, 0, 24, 112, "#0b111e");

  // ===== 左側上舖 =====
  rectangle(42, 133, 286, 105, "#352c37");
  rectangle(48, 139, 274, 91, "#614d50");
  rectangle(58, 145, 255, 75, "#7285a4");

  // 床單與枕頭
  rectangle(65, 150, 68, 58, "#c2c8d0");
  rectangle(69, 154, 60, 48, "#e0dcd5");
  rectangle(136, 152, 169, 57, "#536b91");
  rectangle(136, 198, 169, 10, "#405778");
  rectangle(145, 157, 145, 3, "#8195b2");

  // 床架與護欄
  rectangle(42, 226, 286, 13, "#3a3440");
  rectangle(45, 237, 18, 155, "#51434b");
  rectangle(307, 237, 18, 155, "#51434b");
  rectangle(45, 133, 8, 104, "#85717a");
  rectangle(318, 133, 8, 104, "#85717a");

  // ===== 左側書桌 =====
  rectangle(65, 310, 235, 23, "#806454");
  rectangle(65, 310, 235, 5, "#b18b6b");
  rectangle(80, 333, 15, 82, "#55424a");
  rectangle(275, 333, 15, 82, "#55424a");

  // 抽屜
  rectangle(95, 335, 65, 46, "#66505a");
  rectangle(100, 340, 55, 17, "#77606a");
  rectangle(122, 346, 12, 3, "#c0a389");
  rectangle(100, 361, 55, 16, "#77606a");
  rectangle(122, 367, 12, 3, "#c0a389");

  // 左側電腦
  rectangle(140, 252, 104, 64, "#090e19");
  rectangle(145, 257, 94, 53, "#263e52");
  rectangle(150, 262, 84, 43, "#235e72");
  rectangle(160, 272, 50, 3, "#66b6bd");
  rectangle(160, 280, 62, 2, "#418c9b");
  rectangle(160, 286, 35, 2, "#418c9b");
  rectangle(187, 316, 10, 8, "#414451");

  // ===== 中央階梯 =====
  for (let i = 0; i < 5; i++) {
    const sy = 125 + i * 48;

    rectangle(390, sy, 155, 35, "#5b4850");
    rectangle(390, sy, 155, 6, "#a17a68");
    rectangle(390, sy + 29, 155, 7, "#332d39");
    rectangle(399, sy + 11, 137, 2, "#725961");
  }

  // ===== 右側上舖 =====
  rectangle(617, 133, 286, 105, "#352c37");
  rectangle(623, 139, 274, 91, "#614d50");
  rectangle(635, 145, 250, 75, "#6a7c99");

  // 床單與枕頭
  rectangle(640, 150, 68, 58, "#c3c7d0");
  rectangle(644, 154, 60, 48, "#e1dcd5");
  rectangle(710, 152, 165, 57, "#4a6387");
  rectangle(710, 198, 165, 10, "#394e70");
  rectangle(720, 157, 145, 3, "#7d90aa");

  // 床架
  rectangle(617, 226, 286, 13, "#3a3440");
  rectangle(620, 237, 18, 155, "#51434b");
  rectangle(882, 237, 18, 155, "#51434b");
  rectangle(620, 133, 8, 104, "#85717a");
  rectangle(895, 133, 8, 104, "#85717a");

  // ===== 右側書桌 =====
  rectangle(645, 310, 230, 23, "#806454");
  rectangle(645, 310, 230, 5, "#b18b6b");
  rectangle(660, 333, 15, 82, "#55424a");
  rectangle(850, 333, 15, 82, "#55424a");

  // 抽屜
  rectangle(790, 335, 60, 46, "#66505a");
  rectangle(795, 340, 50, 17, "#77606a");
  rectangle(814, 346, 12, 3, "#c0a389");
  rectangle(795, 361, 50, 16, "#77606a");
  rectangle(814, 367, 12, 3, "#c0a389");

  // ===== 被駭入的電腦 =====
  const glow = 0.85 + Math.sin(Date.now() / 300) * 0.15;

  ctx.save();

  const light = ctx.createRadialGradient(
    770, 280, 5, 770, 280, 150
  );

  light.addColorStop(0,
    `rgba(0, 230, 190, ${0.22 * glow})`);
  light.addColorStop(1,
    "rgba(0, 230, 190, 0)");

  ctx.fillStyle = light;
  ctx.fillRect(620, 130, 300, 300);

  ctx.restore();

  // 電腦外框
  rectangle(712, 242, 116, 70, "#080d18");
  rectangle(718, 248, 104, 58, "#29434c");
  rectangle(723, 253, 94, 48, "#063b3d");

  // 程式碼
  rectangle(729, 259, 44, 2, "#3bceac");
  rectangle(729, 265, 61, 2, "#1e8979");
  rectangle(729, 293, 53, 2, "#3bceac");

  if (Math.sin(Date.now() / 180) > -0.4) {
    text("HACKED", 734, 283, 14, "#91ffe1");
  }

  // 螢幕底座
  rectangle(765, 312, 10, 8, "#394650");
  rectangle(751, 320, 38, 4, "#394650");

  // ===== 書桌燈 =====
  rectangle(675, 270, 9, 40, "#877c79");
  rectangle(660, 255, 35, 18, "#c4a56d");
  rectangle(665, 272, 25, 3, "#f2cc83");

  // ===== 中央地毯 =====
  rectangle(327, 407, 306, 101, "#252b43");
  rectangle(334, 414, 292, 87, "#46516d");
  rectangle(344, 424, 272, 67, "#37435f");
  rectangle(351, 431, 258, 53, "#404c67");

  // 地毯邊框
  rectangle(344, 424, 272, 3, "#72809a");
  rectangle(344, 488, 272, 3, "#25324d");

  // ===== 信封 =====
  rectangle(588, 434, 44, 29, "#a99a81");
  rectangle(591, 436, 38, 25, "#e4d8b9");
  rectangle(599, 445, 22, 3, "#a88b70");
  rectangle(604, 451, 12, 2, "#bfae91");

  // ===== 鑰匙 =====
  rectangle(645, 450, 25, 6, "#d5b65c");
  rectangle(643, 444, 12, 12, "#e3c978");
  rectangle(647, 447, 5, 5, "#344057");
  rectangle(664, 456, 4, 7, "#d5b65c");

  // ===== 線索提示 =====
  if (Math.floor(Date.now() / 400) % 2 === 0) {
    text("!", 605, 425, 24, "#ffe08a");
  }
}


  // ====================================
  // 主角
  // ====================================

  const player = {
    x: 120,
    y: 400,
    targetX: 575,
    speed: 2.2,
    state: "walking"
  };

  function drawPlayer() {

    const x = player.x;
    const y = player.y;

    // 影子
    rectangle(x + 3, y + 58, 38, 8, "#17202e");

    // 頭髮
    rectangle(x + 8, y, 27, 17, "#25202d");

    // 臉
    rectangle(x + 11, y + 12, 23, 20, "#e1b18e");

    // 眼睛
    rectangle(x + 27, y + 19, 4, 4, "#222331");

    // 衣服
    rectangle(x + 5, y + 32, 36, 25, "#718eb3");

    // 背包
    rectangle(x, y + 35, 9, 23, "#4b536a");

    // 腳
    let legOffset = 0;

    if (player.state === "walking") {
      legOffset = Math.sin(animationTime * 0.2) * 5;
    }

    rectangle(
      x + 10,
      y + 57,
      10,
      15 + legOffset,
      "#273044"
    );

    rectangle(
      x + 27,
      y + 57,
      10,
      15 - legOffset,
      "#273044"
    );
  }

  // ====================================
  // 對話
  // ====================================

  function showDialogue(message) {
    dialogue.style.display = "block";
    dialogue.textContent = message;
  }

  function hideDialogue() {
    dialogue.style.display = "none";
  }

  // ====================================
  // 開始遊戲
  // ====================================

  function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(
      screen => screen.classList.remove("active")
    );
  }


let transitionStart = 0;
  function startGame() {
  hideAllScreens();

  gameStarted = false;
  animationTime = 0;
  clueShown = false;

  player.x = 120;
  player.state = "idle";

  hideDialogue();

  const flash = document.getElementById("flash");

  // 白光閃過，逐漸露出宿舍
  flash.classList.remove("active");
    transitionStart = performance.now();
  void flash.offsetWidth;
  flash.classList.add("active");

  // 2 秒後主角漸漸出現
  canvas.style.opacity = "1";

  // 4 秒後才開始走路
  setTimeout(() => {
    player.state = "walking";
    gameStarted = true;
    showDialogue("主角：電腦好像被入侵了……");
  }, 4000);
}


  // ====================================
  // 主角自動走路與撿拾
  // ====================================

  let clueShown = false;

  function updatePlayer() {

    if (!gameStarted) return;

    animationTime++;

    if (player.state === "walking") {

      player.x += player.speed;

      if (player.x >= player.targetX) {
        player.x = player.targetX;
        player.state = "investigating";

        showDialogue(
          "主角：奇怪……地上怎麼有東西？"
        );
      }
    }

    if (player.state === "investigating") {

      if (animationTime > 260) {
        player.state = "picking";
        showDialogue("主角：這是什麼線索？");
      }
    }

    if (player.state === "picking") {

      if (animationTime > 340 && !clueShown) {
        clueShown = true;
        player.state = "finished";

        hideDialogue();

        setTimeout(showClues, 800);
      }
    }
  }

  // ====================================
  // 同時顯示兩個線索
  // ====================================

  function showClues() {
    gameStarted = false;
    hideAllScreens();

    document
      .getElementById("clueScreen")
      .classList.add("active");
  }

  // ====================================
  // 四位嫌疑人
  // ====================================

  function showSuspects() {

    hideAllScreens();

    document
      .getElementById("suspectScreen")
      .classList.add("active");

    const list = document.getElementById("suspectList");

    list.innerHTML = "";

    suspects.forEach((suspect, index) => {

      const card = document.createElement("div");

      card.className = "suspect";

      if (selectedSuspect === index) {
        card.classList.add("selected");
      }

      const title = document.createElement("h3");
      title.textContent = suspect.name;

      const instrument = document.createElement("p");
      instrument.textContent = suspect.instrument;

      const playButton = document.createElement("button");
      playButton.textContent = "▶ 試聽音樂";
      playButton.onclick = () => playMusic(index);

      const selectButton = document.createElement("button");
      selectButton.textContent =
        selectedSuspect === index ? "✓ 已選擇" : "指認此人";

      selectButton.onclick = () => {
        selectedSuspect = index;
        showSuspects();
      };

      card.appendChild(title);
      card.appendChild(instrument);
      card.appendChild(playButton);
      card.appendChild(selectButton);

      list.appendChild(card);
    });
  }

  // ====================================
  // 播放音樂
  // ====================================

  function playMusic(index) {

    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    currentAudio = new Audio(suspects[index].audio);

    currentAudio.play().catch(() => {
      alert(
        "尚未找到音樂檔案，請先加入：" +
        suspects[index].audio
      );
    });
  }

  // ====================================
  // 確認駭客身分
  // ====================================

 
function confirmSuspect() {
  if (selectedSuspect === -1) {
    alert("請先選擇一位嫌疑人！");
    return;
  }

  if (currentAudio) {
    currentAudio.pause();
  }

  const isCorrect = selectedSuspect === correctSuspect;

 const endingVideo = isCorrect
  ? "videos/success.mp4"
  : "videos/failure.mp4";

  playStoryVideo(endingVideo, () => {
    hideAllScreens();

    document.getElementById("resultScreen")
      .classList.add("active");

    document.getElementById("resultText").textContent =
      isCorrect
        ? "成功找出真正的駭客！"
        : "指認錯誤，駭客仍然逍遙法外……";
  });
}


  // ====================================
  // 遊戲主迴圈
  // ====================================

  function gameLoop() {

    ctx.clearRect(0, 0, 960, 540);

    drawRoom();
    updatePlayer();
   
if (!gameStarted && player.state === "idle") {
  const flash = document.getElementById("flash");

  if (flash.classList.contains("active")) {
    const elapsed = performance.now() - transitionStart;
    ctx.globalAlpha = Math.min(1, Math.max(0, (elapsed - 1500) / 1500));
  }
}

drawPlayer();
ctx.globalAlpha = 1;


    requestAnimationFrame(gameLoop);
  }

  // 初始化
  gameLoop();

</script>

</body>
</html>
