// 音樂淡入淡出（預設 2 秒）
const fadeTimers = new WeakMap();

function fadeAudio(audio, from, to, duration = 2000, onComplete = null) {
  if (!audio) return;

  // 取消同一首音樂正在進行的淡入淡出
  if (fadeTimers.has(audio)) {
    clearInterval(fadeTimers.get(audio));
  }

  const start = performance.now();
  audio.volume = from;

  const timer = setInterval(() => {
    const progress = Math.min(
      (performance.now() - start) / duration, 1
    );

    audio.volume = Math.max(
      0,
      Math.min(1, from + (to - from) * progress)
    );

    if (progress >= 1) {
      clearInterval(timer);
      fadeTimers.delete(audio);
      if (onComplete) onComplete();
    }
  }, 30);

  fadeTimers.set(audio, timer);
}

async function revealResultsEarly() {
  if (gameOver || !timerInterval) return;

  if (!firebaseAuth.currentUser ||
      firebaseAuth.currentUser.uid !== ADMIN_UID) {
    alert("只有主持人可以公布結果");
    return;
  }

  const confirmed = confirm(
    "確定要提前結束投票並公布結果嗎？\n此操作無法復原。"
  );

  if (!confirmed) return;

  const button = document.getElementById("revealResultsButton");
  button.disabled = true;
  button.textContent = "正在結束投票……";

  try {
    const sessionSnapshot = await get(
      ref(firebaseDB, "currentSession")
    );

    if (!sessionSnapshot.exists()) {
      throw new Error("找不到投票場次");
    }

    const sessionId = sessionSnapshot.val();

    await set(
      ref(firebaseDB, "sessions/" + sessionId + "/config/status"),
      "closed"
    );

    gameOver = true;
    gameStarted = false;
    stopTimer();

async function showVotingResults() {

    const sessionSnapshot = await get(
      ref(firebaseDB, "currentSession")
    );

    if (!sessionSnapshot.exists()) {
      throw new Error("找不到投票場次");
    }

    const sessionId = sessionSnapshot.val();

    const votesSnapshot = await get(
      ref(firebaseDB, "sessions/" + sessionId + "/votes")
    );

    const counts = [0, 0, 0, 0];

    if (votesSnapshot.exists()) {
      Object.values(votesSnapshot.val()).forEach(vote => {
        if (Number.isInteger(vote) && vote >= 0 && vote <= 3) {
          counts[vote]++;
        }
      });
    }

    const total = counts.reduce((sum, count) => sum + count, 0);

    const names = [
      "嫌疑人一",
      "嫌疑人二",
      "嫌疑人三",
      "嫌疑人四"
    ];

    const lines = counts.map((count, index) => {
      const percentage = total === 0
        ? 0
        : (count / total * 100).toFixed(1);

      return `${names[index]}：${count} 票（${percentage}%）`;
    });

    document.getElementById("resultText").textContent =
      `投票結束！共 ${total} 票\n\n` +
      lines.join("\n") +
      "\n\n真正的駭客是：羅思穎！";

document.getElementById("revealResultsButton").style.display = "block";

  // ====================================
  // 播放音樂
  // ====================================

function updatePlayButtons() {
  document.querySelectorAll(".suspect-play-btn").forEach(btn => {
    const i = Number(btn.dataset.index);

    btn.textContent =
      currentAudio &&
      currentSuspectIndex === i &&
      !currentAudio.paused
        ? "⏸ 暫停"
        : "▶ 播放";
  });
}

function playMusic(index) {

  // 同一位嫌疑犯：暫停或繼續
  if (currentAudio && currentSuspectIndex === index) {
    const audio = currentAudio;

    if (!audio.paused) {
      fadeAudio(audio, audio.volume, 0, 500, () => {
        audio.pause();
        updatePlayButtons();
      });
    } else {
      audio.play().then(() => {
        fadeAudio(audio, audio.volume, 1, 500);
        updatePlayButtons();
      }).catch(console.error);
    }
    return;
  }

  // 背景音樂淡出
  fadeAudio(puzzleMusic, puzzleMusic.volume, 0, 2000, () => {
    puzzleMusic.pause();
  });

  // 前一位嫌疑犯淡出
  if (currentAudio) {
    const oldAudio = currentAudio;
    oldAudio.onended = null;

    fadeAudio(oldAudio, oldAudio.volume, 0, 1000, () => {
      oldAudio.pause();
      oldAudio.currentTime = 0;
    });
  }

  // 新嫌疑犯音樂淡入
  const newAudio = new Audio(suspects[index].audio);

  currentAudio = newAudio;
  currentSuspectIndex = index;
  newAudio.volume = 0;

  newAudio.play().then(() => {
    fadeAudio(newAudio, 0, 1, 2000);
    updatePlayButtons();
  }).catch(console.error);

  // 播放結束後，恢復解謎音樂
  newAudio.onended = () => {
    if (currentAudio !== newAudio) return;

    currentAudio = null;
    currentSuspectIndex = -1;
    updatePlayButtons();

    puzzleMusic.volume = 0;
    puzzleMusic.play().then(() => {
      fadeAudio(puzzleMusic, 0, 0.3, 2000);
    }).catch(console.error);
  };

  updatePlayButtons();
}

stopTimer();

 // 選對：立即停止嫌疑犯音樂
