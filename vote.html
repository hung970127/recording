
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駭客在哪裡｜匿名投票</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 15px 50px;
  background: #080c18;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #92d8ff;
  letter-spacing: 2px;
}

.subtitle {
  color: #b8c9dc;
  line-height: 1.7;
}

#timer {
  font-size: 42px;
  font-weight: bold;
  color: #ffe18c;
  margin: 18px 0;
}

#status {
  color: #92d8ff;
  margin: 15px auto;
  line-height: 1.7;
}

.suspects {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  max-width: 650px;
  margin: 25px auto;
}

.card {
  border: 2px solid #344965;
  border-radius: 12px;
  background: #141e30;
  padding: 12px;
}

.card.selected {
  border-color: #ffe18c;
  background: #263047;
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 8px;
  background: #202c3f;
}

.card h3 {
  margin: 12px 0;
}

button {
  border: 1px solid #92d8ff;
  background: #253a58;
  color: white;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.playBtn, .chooseBtn {
  display: block;
  width: 100%;
  margin-top: 10px;
}

.chooseBtn.selected {
  background: #876b30;
  border-color: #ffe18c;
}

#submitBtn {
  width: min(100%, 350px);
  padding: 16px;
  background: #356b56;
  border: 2px solid #8cddaf;
  font-size: 18px;
  font-weight: bold;
  margin: 10px auto;
}

#message {
  line-height: 1.8;
  max-width: 600px;
  margin: 20px auto;
}

@media (max-width: 350px) {
  .suspects {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>駭客在哪裡？</h1>

<p class="subtitle">
聆聽四個神秘訊號<br>
找出真正入侵電腦的駭客
</p>

<div id="timer">05:00</div>
<p id="status">正在連線至投票系統……</p>

<div class="suspects" id="suspects"></div>

<button id="submitBtn" disabled>
確認投票
</button>

<p id="message"></p>

<div id="jokeScreen" style="
  display:none;
  max-width:500px;
  margin:30px auto;
  padding:30px 22px;
  background:#141e30;
  border:2px solid #6de5c6;
  border-radius:14px;
  box-shadow:0 0 25px rgba(109,229,198,0.15);
">

  <div style="
    color:#6de5c6;
    font-size:14px;
    letter-spacing:2px;
  ">
    ✓ VOTE SUBMITTED
  </div>

  <h2 style="color:#ffffff;">
    投票成功！
  </h2>

  <p style="color:#b8c9dc;">
    你的選票已經成功送出
  </p>

  <hr style="
    border:0;
    border-top:1px solid #344965;
    margin:25px 0;
  ">

  <p style="color:#ffe18c;">
    等待結果的冷笑話
  </p>

  <h2 id="jokeQuestion" style="
    line-height:1.7;
    color:#ffffff;
  "></h2>

  <p id="jokeAnswer" style="
    color:#92d8ff;
    font-size:19px;
    line-height:1.8;
  "></p>

  <button id="nextJokeBtn" style="
    margin-top:15px;
    padding:14px 28px;
    background:#253a58;
    border:2px solid #92d8ff;
  ">
    再來一個冷笑話 →
  </button>

  <p style="
    color:#8297b4;
    font-size:13px;
    margin-top:25px;
  ">
    請等待前方螢幕公布調查結果
  </p>

</div>

<div id="votingEndedScreen" style="
  display:none;
  max-width:500px;
  margin:40px auto;
  padding:35px 20px;
  background:#141e30;
  border:2px solid #92d8ff;
  border-radius:14px;
">
  <h1>🔒 投票已結束</h1>
  <p style="font-size:18px;line-height:1.8;">
    本次調查已經結束<br>
    感謝你的參與！
  </p>
  <p style="color:#ffe18c;">
    請觀看前方螢幕，等待調查結果公布。
  </p>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  onValue
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const suspects = [
  {
    name: "訊號一",
    image: "images/徐正庭.jpg",
    audio: "music/徐正庭.wav"
  },
  {
    name: "訊號二",
    image: "images/許宸瑋.jpg",
    audio: "music/許宸瑋.mp3"
  },
  {
    name: "訊號三",
    image: "images/周裕軒.jpg",
    audio: "music/周裕軒.wav"
  },
  {
    name: "訊號四",
    image: "images/洪昕妤.jpg",
    audio: "music/洪昕妤.wav"
  }
];

const $ = id => document.getElementById(id);

const jokes = [
  {
    question: "為什麼鋼琴家不怕迷路？",
    answer: "因為他很會找 Key。"
  },
  {
    question: "為什麼鼓手很容易遲到？",
    answer: "因為他一直在拖拍。"
  },
  {
    question: "為什麼吉他手不喜歡吵架？",
    answer: "因為他只想和弦。"
  },
  {
    question: "為什麼貝斯手很少被發現？",
    answer: "因為大家都沒注意到他在不在。"
  },
  {
    question: "為什麼錄音師不敢說謊？",
    answer: "因為所有事情都有 Record。"
  },
  {
    question: "為什麼駭客不喜歡吃餅乾？",
    answer: "因為他怕被 Cookie 追蹤。"
  },
  {
    question: "為什麼作曲家不喜歡分手？",
    answer: "因為他怕沒有下一個小節。"
  },
  {
    question: "為什麼音樂系學生不怕考試？",
    answer: "因為他們早就習慣被當（降）了。"
  },
  {
    question: "為什麼麥克風很會保守秘密？",
    answer: "因為它都只會收音，不會回嘴。"
  },
  {
    question: "為什麼電腦被駭客入侵後不敢睡覺？",
    answer: "因為它怕被偷偷開機。"
  }
];

let lastJokeIndex = -1;

function showRandomJoke() {
  if (jokes.length === 0) return;

  let index;

  do {
    index = Math.floor(Math.random() * jokes.length);
  } while (index === lastJokeIndex && jokes.length > 1);

  lastJokeIndex = index;

  $("jokeQuestion").textContent = jokes[index].question;
  $("jokeAnswer").textContent = jokes[index].answer;
}

$("nextJokeBtn").onclick = showRandomJoke;

let sessionId = null;
let sessionConfig = null;
let selectedSuspect = -1;
let alreadyVoted = false;
let submitting = false;
let ready = false;
let serverOffset = 0;

let unsubscribeConfig = null;
let unsubscribeVote = null;

// 四首 WAV 各自建立播放器
const audioPlayers = suspects.map(suspect => {
  const audio = new Audio();
  audio.preload = "auto";

  return audio;
});

// 記錄已下載完成的音樂
const audioBlobURLs = new Array(suspects.length).fill(null);

// 主動下載完整 WAV，但不干擾正在播放的音樂
async function preloadOneMusic(index) {
  if (audioBlobURLs[index]) return;

  try {
    const response = await fetch(suspects[index].audio);

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const blob = await response.blob();

    audioBlobURLs[index] = URL.createObjectURL(blob);

    console.log("WAV 預載完成：", suspects[index].name);

  } catch (error) {
    console.error("WAV 預載失敗：", suspects[index].audio, error);
  }
}

// 四首同時開始下載
function preloadMusic() {
  suspects.forEach((_, index) => {
    preloadOneMusic(index);
  });
}

let audioPlayer = audioPlayers[0];
let playingIndex = -1;
  
function showMessage(text) {
  $("message").textContent = text;
}

function serverNow() {
  return Date.now() + serverOffset;
}

function votingOpen() {
  return ready &&
    !alreadyVoted &&
    !submitting &&
    sessionConfig &&
    sessionConfig.status === "open" &&
    serverNow() >= sessionConfig.startedAt &&
    serverNow() < sessionConfig.endsAt;
}

function stopMusic() {
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  playingIndex = -1;
  updateButtons();
}

function renderSuspects() {
  const container = $("suspects");
  container.innerHTML = "";

  suspects.forEach((suspect, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + index;

    const img = document.createElement("img");
    img.src = suspect.image;
    img.alt = suspect.name;

    const title = document.createElement("h3");
    title.textContent = suspect.name;

    const play = document.createElement("button");
    play.className = "playBtn";
    play.id = "play-" + index;
    play.textContent = "▶ 播放音樂";
    play.onclick = () => playMusic(index);

    const choose = document.createElement("button");
    choose.className = "chooseBtn";
    choose.id = "choose-" + index;
    choose.textContent = "選擇這位嫌疑犯";
    choose.onclick = () => selectSuspect(index);

    card.append(img, title, play, choose);
    container.appendChild(card);
  });

  updateButtons();
}

function playMusic(index) {

  // 同一首正在播放，就暫停
  if (playingIndex === index && !audioPlayer.paused) {
    audioPlayer.pause();
    playingIndex = -1;
    updateButtons();
    return;
  }

  // 停止上一首
  audioPlayer.pause();

  // 選擇播放器
  const audio = audioPlayers[index];
  audioPlayer = audio;

  // 有完整下載的 WAV 就使用記憶體版本
  // 否則直接使用原始 WAV 網址
  const source = audioBlobURLs[index] || suspects[index].audio;

  if (audio.src !== new URL(source, location.href).href) {
    audio.src = source;
  }

  audio.currentTime = 0;
  playingIndex = index;

  showMessage("正在播放音樂……");

  audio.play()
    .then(() => {
      if (audioPlayer !== audio || playingIndex !== index) return;

      showMessage("");
      updateButtons();
    })
    .catch(error => {
      if (audioPlayer !== audio || playingIndex !== index) return;

      console.error("音樂播放失敗：", error);

      playingIndex = -1;

      showMessage(
        "音樂播放失敗：" +
        error.name + " - " + error.message
      );

      updateButtons();
    });

  updateButtons();
}

// 四首音樂播放完畢後都會更新按鈕
audioPlayers.forEach((audio, index) => {
  audio.addEventListener("ended", () => {
    if (playingIndex === index) {
      playingIndex = -1;
      updateButtons();
    }
  });
});

function selectSuspect(index) {
  if (!votingOpen()) return;

  selectedSuspect = index;
  updateButtons();
}

function updateButtons() {
  const canVote = votingOpen();

  suspects.forEach((_, index) => {
    const card = $("card-" + index);
    const play = $("play-" + index);
    const choose = $("choose-" + index);

    if (!card) return;

    card.classList.toggle(
      "selected",
      selectedSuspect === index
    );

    play.textContent =
      playingIndex === index && !audioPlayer.paused
        ? "⏸ 暫停音樂"
        : "▶ 播放音樂";

    choose.disabled = !canVote;

    choose.classList.toggle(
      "selected",
      selectedSuspect === index
    );

    choose.textContent =
      selectedSuspect === index
        ? "✓ 已選擇"
        : "選擇這位嫌疑犯";
  });

  $("submitBtn").disabled =
    !canVote || selectedSuspect === -1;

  if (alreadyVoted) {
    $("submitBtn").textContent = "✓ 已完成投票";
  } else if (submitting) {
    $("submitBtn").textContent = "正在送出……";
  } else {
    $("submitBtn").textContent = "確認投票";
  }
}

function updateTimer() {
 
  const ended = sessionConfig && (
    sessionConfig.status === "closed" ||
    serverNow() >= sessionConfig.endsAt
  );

 
  const showJokes = !ended && alreadyVoted;

  $("votingEndedScreen").style.display = ended ? "block" : "none";
  $("jokeScreen").style.display = showJokes ? "block" : "none";

  $("suspects").style.display =
    ended || showJokes ? "none" : "grid";

  $("submitBtn").style.display =
    ended || showJokes ? "none" : "block";

  $("timer").style.display = ended ? "none" : "block";

  $("status").style.display =
    ended || showJokes ? "none" : "block";

  $("message").style.display =
    ended || showJokes ? "none" : "block";

  if (showJokes && lastJokeIndex === -1) {
    showRandomJoke();
  }


  if (ended && !audioPlayer.paused) {
    audioPlayer.pause();
    audioPlayer.currentTime = 0;
    playingIndex = -1;
  }

  if (!sessionConfig) {
    $("timer").textContent = "05:00";
    updateButtons();
    return;
  }

  const seconds = Math.max(
    0,
    Math.ceil(
      (sessionConfig.endsAt - serverNow()) / 1000
    )
  );

  const minutes = Math.floor(seconds / 60);
  const remaining = seconds % 60;

  $("timer").textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(remaining).padStart(2, "0");

  if (alreadyVoted) {
    $("status").textContent = "投票成功，感謝參與！";
  } else if (seconds === 0 ||
             sessionConfig.status === "closed") {
    $("status").textContent = "投票時間已結束";
  } else if (!ready) {
    $("status").textContent = "正在確認投票資格……";
  } else {
    $("status").textContent = "投票進行中";
  }

  updateButtons();
}

function clearSessionListeners() {
  if (unsubscribeConfig) {
    unsubscribeConfig();
    unsubscribeConfig = null;
  }

  if (unsubscribeVote) {
    unsubscribeVote();
    unsubscribeVote = null;
  }
}

async function loadSession(id, user) {
  clearSessionListeners();

  sessionId = id;
  sessionConfig = null;
  selectedSuspect = -1;
  alreadyVoted = false;
  ready = false;

  showMessage("");
  updateTimer();

  if (!id) {
    $("status").textContent = "目前沒有開放中的投票";
    return;
  }

  const configRef = ref(
    db, "sessions/" + id + "/config"
  );

  const myVoteRef = ref(
    db, "sessions/" + id + "/votes/" + user.uid
  );

  unsubscribeConfig = onValue(
    configRef,
    snapshot => {
      sessionConfig = snapshot.val();
      updateTimer();
    },
    error => {
      showMessage("讀取場次失敗：" + error.message);
    }
  );

  unsubscribeVote = onValue(
    myVoteRef,
    snapshot => {
      alreadyVoted = snapshot.exists();
      ready = true;

      if (alreadyVoted) {
        selectedSuspect = snapshot.val();
        showMessage("你的選票已經成功記錄。");
      }

      updateTimer();
    },
    error => {
      ready = false;
      showMessage("確認投票資格失敗：" + error.message);
      updateButtons();
    }
  );
}

$("submitBtn").onclick = async () => {
  if (!votingOpen() || selectedSuspect < 0) return;

  const user = auth.currentUser;
  if (!user || !sessionId) return;

  const voteSessionId = sessionId;
  const voteIndex = selectedSuspect;

  submitting = true;
  updateButtons();

  try {
    const voteRef = ref(
      db,
      "sessions/" + voteSessionId + "/votes/" + user.uid
    );

    await set(voteRef, voteIndex);

 
    alreadyVoted = true;
    stopMusic();
    showMessage("投票成功！你的選票已經送出。");
    updateTimer();

  } catch (error) {
    showMessage(
      "投票未成功，可能已投過票或時間已截止：" +
      error.message
    );
  } finally {
    submitting = false;
    updateTimer();
  }
};

renderSuspects();

// 玩家開啟投票頁面後預先載入四首 WAV
preloadMusic();

onValue(
  ref(db, ".info/serverTimeOffset"),
  snapshot => {
    serverOffset = snapshot.val() || 0;
    updateTimer();
  }
);

setInterval(updateTimer, 500);

onAuthStateChanged(auth, async user => {
  if (!user) {
    try {
      await signInAnonymously(auth);
    } catch (error) {
      $("status").textContent = "登入失敗";
      showMessage(
        "匿名登入失敗：" + error.message
      );
    }
    return;
  }

  try {
    onValue(
      ref(db, "currentSession"),
      snapshot => {
        const id = snapshot.val();

        if (id !== sessionId) {
          loadSession(id, user);
        }
      },
      error => {
        showMessage(
          "無法取得目前投票場次：" + error.message
        );
      }
    );
  } catch (error) {
    showMessage("連線失敗：" + error.message);
  }
});

</script>
</body>
</html>
