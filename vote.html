
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駭客在哪裡｜匿名投票</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 15px 50px;
  background: #080c18;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #92d8ff;
  letter-spacing: 2px;
}

.subtitle {
  color: #b8c9dc;
  line-height: 1.7;
}

#timer {
  font-size: 42px;
  font-weight: bold;
  color: #ffe18c;
  margin: 18px 0;
}

#status {
  color: #92d8ff;
  margin: 15px auto;
  line-height: 1.7;
}

.suspects {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  max-width: 650px;
  margin: 25px auto;
}

.card {
  border: 2px solid #344965;
  border-radius: 12px;
  background: #141e30;
  padding: 12px;
}

.card.selected {
  border-color: #ffe18c;
  background: #263047;
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 8px;
  background: #202c3f;
}

.card h3 {
  margin: 12px 0;
}

button {
  border: 1px solid #92d8ff;
  background: #253a58;
  color: white;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.playBtn, .chooseBtn {
  display: block;
  width: 100%;
  margin-top: 10px;
}

.chooseBtn.selected {
  background: #876b30;
  border-color: #ffe18c;
}

#submitBtn {
  width: min(100%, 350px);
  padding: 16px;
  background: #356b56;
  border: 2px solid #8cddaf;
  font-size: 18px;
  font-weight: bold;
  margin: 10px auto;
}

#message {
  line-height: 1.8;
  max-width: 600px;
  margin: 20px auto;
}

@media (max-width: 350px) {
  .suspects {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>駭客在哪裡？</h1>

<p class="subtitle">
聆聽四位嫌疑犯的音樂<br>
找出真正入侵電腦的駭客
</p>

<div id="timer">05:00</div>
<p id="status">正在連線至投票系統……</p>

<div class="suspects" id="suspects"></div>

<button id="submitBtn" disabled>
確認投票
</button>

<p id="message"></p>

<div id="votingEndedScreen" style="
  display:none;
  max-width:500px;
  margin:40px auto;
  padding:35px 20px;
  background:#141e30;
  border:2px solid #92d8ff;
  border-radius:14px;
">
  <h1>🔒 投票已結束</h1>
  <p style="font-size:18px;line-height:1.8;">
    本次調查已經結束<br>
    感謝你的參與！
  </p>
  <p style="color:#ffe18c;">
    請觀看前方螢幕，等待調查結果公布。
  </p>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  onValue
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const suspects = [
  {
    name: "嫌疑犯 1",
    image: "images/JT.png",
    audio: "music/hacker.mp3"
  },
  {
    name: "嫌疑犯 2",
    image: "images/suspect2.png",
    audio: "music/viola.mp3"
  },
  {
    name: "嫌疑犯 3",
    image: "images/suspect3.png",
    audio: "music/vocal.mp3"
  },
  {
    name: "嫌疑犯 4",
    image: "images/suspect4.png",
    audio: "music/guitar.mp3"
  }
];

const $ = id => document.getElementById(id);

let sessionId = null;
let sessionConfig = null;
let selectedSuspect = -1;
let alreadyVoted = false;
let submitting = false;
let ready = false;
let serverOffset = 0;

let unsubscribeConfig = null;
let unsubscribeVote = null;

const audioPlayer = new Audio();
let playingIndex = -1;

function showMessage(text) {
  $("message").textContent = text;
}

function serverNow() {
  return Date.now() + serverOffset;
}

function votingOpen() {
  return ready &&
    !alreadyVoted &&
    !submitting &&
    sessionConfig &&
    sessionConfig.status === "open" &&
    serverNow() >= sessionConfig.startedAt &&
    serverNow() < sessionConfig.endsAt;
}

function stopMusic() {
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  playingIndex = -1;
  updateButtons();
}

function renderSuspects() {
  const container = $("suspects");
  container.innerHTML = "";

  suspects.forEach((suspect, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + index;

    const img = document.createElement("img");
    img.src = suspect.image;
    img.alt = suspect.name;

    const title = document.createElement("h3");
    title.textContent = suspect.name;

    const play = document.createElement("button");
    play.className = "playBtn";
    play.id = "play-" + index;
    play.textContent = "▶ 播放音樂";
    play.onclick = () => playMusic(index);

    const choose = document.createElement("button");
    choose.className = "chooseBtn";
    choose.id = "choose-" + index;
    choose.textContent = "選擇這位嫌疑犯";
    choose.onclick = () => selectSuspect(index);

    card.append(img, title, play, choose);
    container.appendChild(card);
  });

  updateButtons();
}

function playMusic(index) {
  if (playingIndex === index && !audioPlayer.paused) {
    audioPlayer.pause();
    playingIndex = -1;
    updateButtons();
    return;
  }

  audioPlayer.pause();
  audioPlayer.src = suspects[index].audio;
  playingIndex = index;

  audioPlayer.play().catch(() => {
    playingIndex = -1;
    showMessage("音樂播放失敗，請確認音檔是否存在。");
    updateButtons();
  });

  updateButtons();
}

audioPlayer.onended = () => {
  playingIndex = -1;
  updateButtons();
};

function selectSuspect(index) {
  if (!votingOpen()) return;

  selectedSuspect = index;
  updateButtons();
}

function updateButtons() {
  const canVote = votingOpen();

  suspects.forEach((_, index) => {
    const card = $("card-" + index);
    const play = $("play-" + index);
    const choose = $("choose-" + index);

    if (!card) return;

    card.classList.toggle(
      "selected",
      selectedSuspect === index
    );

    play.textContent =
      playingIndex === index && !audioPlayer.paused
        ? "⏸ 暫停音樂"
        : "▶ 播放音樂";

    choose.disabled = !canVote;

    choose.classList.toggle(
      "selected",
      selectedSuspect === index
    );

    choose.textContent =
      selectedSuspect === index
        ? "✓ 已選擇"
        : "選擇這位嫌疑犯";
  });

  $("submitBtn").disabled =
    !canVote || selectedSuspect === -1;

  if (alreadyVoted) {
    $("submitBtn").textContent = "✓ 已完成投票";
  } else if (submitting) {
    $("submitBtn").textContent = "正在送出……";
  } else {
    $("submitBtn").textContent = "確認投票";
  }
}

function updateTimer() {
 
  const ended = sessionConfig && (
    sessionConfig.status === "closed" ||
    serverNow() >= sessionConfig.endsAt
  );

  $("votingEndedScreen").style.display = ended ? "block" : "none";
  $("suspects").style.display = ended ? "none" : "grid";
  $("submitBtn").style.display = ended ? "none" : "block";
  $("timer").style.display = ended ? "none" : "block";
  $("status").style.display = ended ? "none" : "block";
  $("message").style.display = ended ? "none" : "block";

  if (ended && !audioPlayer.paused) {
    audioPlayer.pause();
    audioPlayer.currentTime = 0;
    playingIndex = -1;
  }

  if (!sessionConfig) {
    $("timer").textContent = "05:00";
    updateButtons();
    return;
  }

  const seconds = Math.max(
    0,
    Math.ceil(
      (sessionConfig.endsAt - serverNow()) / 1000
    )
  );

  const minutes = Math.floor(seconds / 60);
  const remaining = seconds % 60;

  $("timer").textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(remaining).padStart(2, "0");

  if (alreadyVoted) {
    $("status").textContent = "投票成功，感謝參與！";
  } else if (seconds === 0 ||
             sessionConfig.status === "closed") {
    $("status").textContent = "投票時間已結束";
  } else if (!ready) {
    $("status").textContent = "正在確認投票資格……";
  } else {
    $("status").textContent = "投票進行中";
  }

  updateButtons();
}

function clearSessionListeners() {
  if (unsubscribeConfig) {
    unsubscribeConfig();
    unsubscribeConfig = null;
  }

  if (unsubscribeVote) {
    unsubscribeVote();
    unsubscribeVote = null;
  }
}

async function loadSession(id, user) {
  clearSessionListeners();

  sessionId = id;
  sessionConfig = null;
  selectedSuspect = -1;
  alreadyVoted = false;
  ready = false;

  showMessage("");
  updateTimer();

  if (!id) {
    $("status").textContent = "目前沒有開放中的投票";
    return;
  }

  const configRef = ref(
    db, "sessions/" + id + "/config"
  );

  const myVoteRef = ref(
    db, "sessions/" + id + "/votes/" + user.uid
  );

  unsubscribeConfig = onValue(
    configRef,
    snapshot => {
      sessionConfig = snapshot.val();
      updateTimer();
    },
    error => {
      showMessage("讀取場次失敗：" + error.message);
    }
  );

  unsubscribeVote = onValue(
    myVoteRef,
    snapshot => {
      alreadyVoted = snapshot.exists();
      ready = true;

      if (alreadyVoted) {
        selectedSuspect = snapshot.val();
        showMessage("你的選票已經成功記錄。");
      }

      updateTimer();
    },
    error => {
      ready = false;
      showMessage("確認投票資格失敗：" + error.message);
      updateButtons();
    }
  );
}

$("submitBtn").onclick = async () => {
  if (!votingOpen() || selectedSuspect < 0) return;

  const user = auth.currentUser;
  if (!user || !sessionId) return;

  const voteSessionId = sessionId;
  const voteIndex = selectedSuspect;

  submitting = true;
  updateButtons();

  try {
    const voteRef = ref(
      db,
      "sessions/" + voteSessionId + "/votes/" + user.uid
    );

    await set(voteRef, voteIndex);

    alreadyVoted = true;
    stopMusic();
    showMessage("投票成功！你的選票已經送出。");
  } catch (error) {
    showMessage(
      "投票未成功，可能已投過票或時間已截止：" +
      error.message
    );
  } finally {
    submitting = false;
    updateTimer();
  }
};

renderSuspects();

onValue(
  ref(db, ".info/serverTimeOffset"),
  snapshot => {
    serverOffset = snapshot.val() || 0;
    updateTimer();
  }
);

setInterval(updateTimer, 500);

onAuthStateChanged(auth, async user => {
  if (!user) {
    try {
      await signInAnonymously(auth);
    } catch (error) {
      $("status").textContent = "登入失敗";
      showMessage(
        "匿名登入失敗：" + error.message
      );
    }
    return;
  }

  try {
    onValue(
      ref(db, "currentSession"),
      snapshot => {
        const id = snapshot.val();

        if (id !== sessionId) {
          loadSession(id, user);
        }
      },
      error => {
        showMessage(
          "無法取得目前投票場次：" + error.message
        );
      }
    );
  } catch (error) {
    showMessage("連線失敗：" + error.message);
  }
});

</script>
</body>
</html>
